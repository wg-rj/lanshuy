<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1F33">
<title>澜枢</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1a1a1a;font-size:16px;padding-bottom:70px}
header{background:#0B1F33;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
header .sub{font-size:11px;opacity:.75;margin-top:2px}
.tabs{display:flex;background:#fff;position:sticky;top:58px;z-index:19;border-bottom:1px solid #dde4ee}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:#666;font-family:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:#0B1F33;font-weight:600;border-bottom-color:#0E6B66}
.page{display:none;padding:12px}
.page.on{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,80,.07)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>div{flex:1}
label{display:block;font-size:12px;color:#6b7785;margin-bottom:4px}
input{width:100%;border:1px solid #d5dde8;border-radius:8px;padding:11px 10px;font-size:16px;font-family:inherit;background:#fbfcfe}
input:focus{outline:none;border-color:#0E6B66;background:#fff}
.go{width:100%;border:0;background:#0E6B66;color:#fff;padding:15px;border-radius:10px;font-size:16px;font-weight:600;font-family:inherit;margin-top:4px}
.go:active{background:#0B1F33}
.title{font-size:15px;font-weight:600;color:#0B1F33;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff}
.b-high{background:#2E7D32}.b-mid{background:#C79100}.b-low{background:#C0504D}.b-vlow{background:#8a8a8a}
.big{font-size:26px;font-weight:700;color:#0B1F33;line-height:1.15}
.bignum{font-size:13px;color:#6b7785;margin-top:2px}
.bar{height:7px;background:#E8EDF4;border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:#0E6B66;border-radius:4px}
.three{display:flex;gap:8px;margin-top:6px}
.three>div{flex:1;text-align:center;background:#F5F8FC;border-radius:8px;padding:8px 4px}
.three .v{font-size:18px;font-weight:700}
.three .k{font-size:11px;color:#6b7785;margin-top:2px}
.three .on{background:#E3EDF9;outline:1.5px solid #0E6B66}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid9>div{background:#F5F8FC;border-radius:7px;padding:7px 4px;text-align:center;position:relative;overflow:hidden}
.grid9 .v{font-size:15px;font-weight:700;position:relative}
.grid9 .k{font-size:11px;color:#6b7785;position:relative}
.grid9 .on{background:#E3EDF9;outline:1.5px solid #0E6B66}
.sc{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #e3e9f2;font-size:15px}
.sc:last-child{border:0}
.sc .p{color:#0E6B66;font-weight:700}
.list{font-size:14px}
.item{background:#fff;border-radius:10px;padding:12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,40,80,.06)}
.item .h{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:6px}
.item .m{font-size:12.5px;color:#5b6674;line-height:1.7}
.item .r{display:flex;gap:6px;margin-top:8px}
.item .r input{flex:1;padding:8px;font-size:14px}
.item .r button{border:0;background:#0E6B66;color:#fff;border-radius:8px;padding:0 14px;font-size:13px;font-family:inherit}
.hit{color:#2E7D32;font-weight:600}.miss{color:#C0504D;font-weight:600}
.empty{text-align:center;color:#8a95a3;padding:40px 20px;font-size:14px;line-height:1.9}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef2f7;font-size:15px}
.stat:last-child{border:0}
.stat b{color:#0B1F33}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde4ee;padding:8px 12px;display:flex;gap:8px;z-index:30}
.foot button{flex:1;border:1px solid #0E6B66;background:#fff;color:#0E6B66;padding:11px;border-radius:9px;font-size:14px;font-family:inherit}
.foot button.p{background:#0E6B66;color:#fff}
.tip{font-size:12px;color:#8a95a3;line-height:1.7;margin-top:8px}
.mini{border:1px solid #0E6B66;background:#fff;color:#0E6B66;border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;font-weight:600}
.mini:disabled{opacity:.5}
#oddsList{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#oddsList .sc{font-size:15.5px;padding:12px 2px;cursor:pointer;line-height:1.5}
#oddsList .sc:active{background:#EEF4F8}
#oddsList .p{font-size:14.5px;white-space:nowrap}
.del{color:#C0504D;font-size:12px;border:0;background:none;font-family:inherit;padding:0}

/* ===== 移动端字号放大（覆盖前面） ===== */
header .sub{font-size:13px}
.tabs button{font-size:15px;padding:13px 0}
label{font-size:13.5px}
.title{font-size:17px}
.badge{font-size:12.5px;padding:4px 11px}
.bignum{font-size:14px}
.big{font-size:30px}
.three .v{font-size:20px}
.three .k{font-size:12.5px}
.grid9 .v{font-size:16px}
.grid9 .k{font-size:12.5px}
.tip{font-size:13.5px;line-height:1.75}
.sc{font-size:15px;padding:11px 2px}
.mini{font-size:13px;padding:6px 14px}
/* ===== 推荐页 ===== */
.seg{display:flex;gap:8px;margin-bottom:4px}
.seg button{flex:1;border:1px solid #0E6B66;background:#fff;color:#0E6B66;border-radius:9px;
  padding:11px 0;font-size:15px;font-weight:600;font-family:inherit}
.seg button.on{background:#0E6B66;color:#fff}
.rc{background:#F5F8FC;border-radius:9px;padding:10px 12px;margin-top:8px}
.rc .nm{font-size:14px;color:#6b7785}
.rc .pk{font-size:17px;font-weight:700;color:#0B1F33;display:flex;justify-content:space-between;align-items:baseline}
.rc .pk b{font-size:16px;color:#0E6B66}
.rc .dt{font-size:13px;color:#6b7785;margin-top:3px}
.combo{background:#0B1F33;color:#fff;border-radius:9px;padding:12px 14px;margin-top:10px;
  display:flex;justify-content:space-between;align-items:baseline}
.combo span{font-size:14px;opacity:.85}
.combo b{font-size:22px;font-weight:700}

/* ===== v3 调整 ===== */
body{padding-bottom:16px}
#oddsList .nm{font-size:13.5px;color:#8a95a3}
#oddsList .tm{font-size:16px;font-weight:700}
.gl{background:#F5F8FC;border-radius:9px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:baseline}
.gl .k{font-size:14px;color:#6b7785}
.gl .v{font-size:17px;font-weight:700;color:#0B1F33}
.gl .v em{font-style:normal;font-size:15px;color:#0E6B66;margin-left:6px}

/* ===== v4 近期状态 ===== */
.rs{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed #e3e9f1}
.rs:last-child{border-bottom:0}
.rs .who{font-size:15px;font-weight:600;color:#0B1F33}
.rs .rec{font-size:14px;color:#6b7785;margin-left:8px}
.rs .num{font-size:15px;font-weight:700;color:#0E6B66}
.mini-tag{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:20px;background:#EEF4F8;color:#0B1F33;margin-left:6px}

/* ===== v6 统计 ===== */
.strow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eef2f7}
.strow:last-child{border-bottom:0}
.stcode{font-size:17px;font-weight:700;color:#0B1F33;letter-spacing:1px;width:66px}
.stbar{flex:1;display:flex;height:9px;border-radius:5px;overflow:hidden;margin:0 8px;background:#eef2f7}
.stbar i{display:block;height:100%}
.stbar .w{background:#0E6B66}.stbar .d{background:#C79100}.stbar .l{background:#C0504D}
.stn{font-size:12.5px;color:#8a95a3;width:52px;text-align:right}
.barrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px}
.barrow .k{width:46px;color:#6b7785}
.barrow .b{flex:1;height:10px;background:#eef2f7;border-radius:5px;overflow:hidden}
.barrow .b i{display:block;height:100%;background:#0E6B66}
.barrow .v{width:52px;text-align:right;font-weight:600}

/* ===== v7 汇总 ===== */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1px solid #d5dde8;background:#fff;border-radius:8px;padding:6px 10px;
  font-size:14px;font-family:inherit;color:#0B1F33;display:inline-flex;align-items:baseline;gap:5px}
.chip b{font-weight:700}
.chip s{font-size:11.5px;color:#8a95a3;text-decoration:none}
.chip.on{background:#0E6B66;border-color:#0E6B66;color:#fff}
.chip.on s{color:#cfe6e3}
.chip.dead{opacity:.35}
.sumsec{font-size:13.5px;font-weight:600;color:#0B1F33;margin:12px 0 2px}

/* ================= v8 手机界面 ================= */
body{font-size:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom));
  background:#F2F5F9;color:#101820}

/* 顶栏 */
header{padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header h1{font-size:21px;letter-spacing:2px;font-weight:700}
header .sub{font-size:13px;opacity:.7;margin-top:3px}

/* 底部导航 */
.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;display:flex;
  background:#fff;border-top:1px solid #E6ECF3;border-bottom:0;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(20,40,80,.07)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:12px;
  color:#94A1B2;font-family:inherit;border-bottom:0;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button::before{font-size:21px;line-height:1;display:block}
.tabs button[data-t="pred"]::before{content:"⚽"}
.tabs button[data-t="sum"]::before{content:"📊"}
.tabs button[data-t="rec"]::before{content:"🎯"}
.tabs button[data-t="ledger"]::before{content:"📒"}
.tabs button[data-t="pred"]{order:1}
.tabs button[data-t="sum"]{order:2}
.tabs button[data-t="rec"]{order:3}
.tabs button[data-t="ledger"]{order:4}
.tabs button.on{color:#0E6B66;font-weight:700;border-bottom:0}

/* 页面与卡片 */
.page{padding:14px 14px 28px}
.card{border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 2px 8px rgba(20,40,80,.06)}
.title{font-size:16px;margin-bottom:12px}

/* 表单 */
label{font-size:14px;color:#7A8797;margin-bottom:7px}
input{padding:14px 12px;border-radius:12px;font-size:17px;border:1.5px solid #DCE3EC;background:#FAFCFE}
.go{padding:17px;border-radius:14px;font-size:17px;font-weight:700}
.row{gap:10px;margin-bottom:14px}

/* 关键数字 */
.big{font-size:30px}
.bignum{font-size:14px;margin-top:4px}
.three{gap:10px}
.three>div{padding:14px 6px;border-radius:12px}
.three .v{font-size:24px}
.three .k{font-size:13px;margin-top:4px}

/* 比赛列表：不再嵌套滚动，改成一行一卡 */
#oddsList{max-height:none;overflow:visible}
#oddsList .sc{font-size:16px;padding:14px 4px;line-height:1.5}
#oddsList .sc:active{background:#F5F8FC}
#oddsList .p{font-size:15px}
#oddsList .nm{font-size:13px;color:#7A8797}
#oddsList .tm{font-size:16.5px;font-weight:600}

/* 分段按钮 */
.seg{gap:10px}
.seg button{padding:13px 0;font-size:16px;border-radius:12px}
.mini{padding:8px 14px;font-size:13.5px;border-radius:10px}

/* 汇总 chips */
.chip{padding:11px 14px;font-size:16.5px;border-radius:12px;border-width:1.5px}
.chip s{font-size:12.5px}
.sumsec{font-size:15px;margin:16px 0 4px}

/* 历史统计行 */
.strow{padding:13px 4px}
.stcode{font-size:18px;width:70px}
.stn{font-size:13px;width:58px}
.stbar{height:10px}
.barrow{font-size:15px;margin-top:9px}
.barrow .k{font-size:15px;width:50px}
.barrow .v{font-size:15px;width:58px}

/* 台账列表 */
.item{border-radius:14px;padding:14px;font-size:15.5px;margin-bottom:11px}
.list{font-size:15.5px}

/* ================= v14 字号再放大 ================= */
body{font-size:17px}
header h1{font-size:22px}
header .sub{font-size:14px}

/* 顶部比赛列表 */
.nm{font-size:15px}
.tm{font-size:18.5px}
#oddsList .sc{font-size:17px;padding:16px 4px}
#oddsList .p{font-size:16.5px}
#oddsList .sc s{font-size:14px}

/* 卡片标题与说明 */
.title{font-size:18px}
.tip{font-size:15px;line-height:1.75}
.sumsec{font-size:17px}
.mini{font-size:15px;padding:9px 16px;border-radius:11px}

/* 近况行 */
.who{font-size:17px}
.rec{font-size:16px}
.num{font-size:16px}
.rs{font-size:16px}

/* 三格数字 */
.three{gap:12px}
.three>div{padding:16px 8px;border-radius:14px}
.three .v{font-size:27px}
.three .k{font-size:15px;margin-top:5px}
.big{font-size:34px}
.bignum{font-size:16px}

/* 表单 */
label{font-size:15.5px}
input{font-size:18px;padding:15px 13px}
.go{font-size:18.5px;padding:18px}

/* 分段按钮 / 盘型 chips */
.seg button{font-size:17px;padding:14px 0}
.chip{font-size:18px;padding:12px 16px}
.chip s{font-size:14px}

/* 规律速查 / 统计 */
.stcode{font-size:20px;width:78px}
.stn{font-size:15px;width:66px}
.stbar{height:11px}
.strow{padding:13px 4px}
.barrow{font-size:16.5px;margin-top:11px}
.barrow .k{font-size:16.5px;width:56px}
.barrow .v{font-size:16.5px;width:64px}

/* 台账 */
.item{border-radius:15px;padding:16px;font-size:17px}
.list{font-size:17px}

/* 底部导航 */
.tabs button{font-size:13px;padding:10px 0 12px}
.tabs button::before{font-size:23px}

/* ================= v15 预测结果区放大 ================= */
#out .card{padding:18px 16px}
#out .title{font-size:19px;margin-bottom:14px}
#out .big{font-size:40px;line-height:1.2}
#out .big span{font-size:27px !important}
#out .three{gap:12px;margin-top:12px}
#out .three>div{padding:18px 8px;border-radius:14px}
#out .three .v{font-size:32px;line-height:1.2}
#out .three .k{font-size:16px;margin-top:6px}
#out .bignum{font-size:17px;margin-top:8px}
#out .sc{font-size:17px;padding:10px 2px}
#out .sc .p{font-size:17px}
#out .tip{font-size:15px;line-height:1.8}
#out .badge{font-size:14px;padding:5px 12px}
#out .go{font-size:19px;padding:18px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>澜枢</h1>
  <div class="sub">Dixon-Coles 泊松 · 只吃赔率 · 离线可用</div>
</header>
<div class="tabs">
  <button class="on" data-t="pred">预测</button>
  <button data-t="ledger">台账</button>
  <button data-t="rec">推荐</button>
  <button data-t="sum">汇总</button>

</div>

<div class="page on" id="pred">
  <div class="card">
    <div class="title"><span>官网在售</span><span><button class="mini" id="expSnap" style="margin-right:6px">导出</button><button class="mini" id="pullBtn">拉取</button></span></div>
    <div id="oddsList" class="tip">点右上角「拉取官网」，一次拿到欧赔（多书商均值）、Coral、让球和近况</div>
    <div class="tip" id="oddsTime"></div>
  </div>
    <div class="card" id="recentCard" style="display:none">
    <div class="title"><span>近期状态</span><span class="tip" id="recentTip"></span></div>
    <div id="recentBody"></div>
  </div>
<div class="card">
    <div class="row">
      <div><label>主队</label><input id="h" placeholder="主队"></div>
      <div><label>客队</label><input id="a" placeholder="客队"></div>
    </div>
    <label>欧赔（必填）</label>
    <div class="row">
      <div><input id="oh" type="number" step="0.01" inputmode="decimal" placeholder="主胜"></div>
      <div><input id="od" type="number" step="0.01" inputmode="decimal" placeholder="平"></div>
      <div><input id="oa" type="number" step="0.01" inputmode="decimal" placeholder="客胜"></div>
    </div>
    <label>让球（选填，正=主队受让）</label>
    <div class="row">
      <div><input id="hc" type="number" step="1" inputmode="numeric" placeholder="让球数"></div>
      <div><input id="ch" type="number" step="0.01" inputmode="decimal" placeholder="让胜"></div>
      <div><input id="cd" type="number" step="0.01" inputmode="decimal" placeholder="让平"></div>
      <div><input id="ca" type="number" step="0.01" inputmode="decimal" placeholder="让负"></div>
    </div>
    <button class="go" id="calc">出结果</button>
  </div>
  <div id="out"></div>
</div>


<div class="page" id="rec">
  <div class="card">
    <div class="title"><span>今日推荐</span><span class="tip" id="recCount"></span></div>
    <div class="seg">
      <button id="leg2" class="on">2 串 1</button>
      <button id="leg3">3 串 1</button>
    </div>
    <div class="tip" style="margin-top:8px">只挑「把握度够高」的场次自动组合。胜平负看 60%、半全场看 40%、比分看前三合计 33%。</div>
  </div>
  <div id="recBody"></div>
</div>

<div class="page" id="sum">
  <div class="card">
    <div class="seg">
      <button class="on" data-s="match">赛事汇总</button>
      <button data-s="index">指数汇总</button>
      <button data-s="hist">历史统计</button>
      <button data-s="rules">规律速查</button>
    </div>
    <div class="tip" id="sumTip" style="margin-top:8px"></div>
  </div>
  <div id="sumBody"></div>
</div>


<div class="page" id="ledger">
  <div class="card">
    <div class="title"><span>这些数字有多可靠</span>
      <button class="mini" id="expBtn" onclick="toggleExp()">展开</button></div>
    <div class="tip">110 场实测。先看清哪个能指望，再看战绩。</div>
    <div id="expectBody" style="display:none;margin-top:12px">
      <div style="font-size:13px;color:#7A8797;margin-bottom:6px">胜平负 · 按把握度分档</div>
      <div id="tierRows"></div>
      <div style="font-size:13px;color:#7A8797;margin:14px 0 6px">其他玩法</div>
      <div id="otherRows"></div>
      <div class="tip" style="margin-top:12px;line-height:1.9">
        一句话：<b style="color:#0B1F33">只有「高把握」值得认真看</b>，其余都是参考。<br>
        半全场 40% 看着低，但 9 种结果随机猜只有 11%，模型是它的 3.7 倍。<br>
        比分 8% 就是基准率，别指望它。
      </div>
    </div>
  </div>
  <div id="ledgerList"></div>
  <div class="card" id="calibBox"></div>
  <div class="card">
    <div class="title">数据</div>
    <div class="tip" id="storeInfo"></div>
    <div class="row" style="margin-top:10px">
      <button class="mini" id="exp" style="flex:1">导出给电脑</button>
      <button class="mini" id="imp" style="flex:1">导入/清空</button>
    </div>
  </div>
</div>

<script>

/* ---- 预期管理 ---- */
const TIERS = [

/* ============ 模型核心 ============ */
const KM=11,RHO=-0.05,S_HT=0.4424,STRETCH=0.06;
const GRID=[];for(let v=0.20;v<=3.6001;v+=0.05)GRID.push(+v.toFixed(2));
const NG=GRID.length;
function poisArr(l){const a=new Array(KM);let f=1;for(let i=0;i<KM;i++){if(i>0)f*=i;a[i]=Math.exp(-l)*Math.pow(l,i)/f;}return a;}
function scoreMatrix(lh,la){const ph=poisArr(lh),pa=poisArr(la);const m=[];let s=0;
 for(let i=0;i<KM;i++){m[i]=[];for(let j=0;j<KM;j++){let v=ph[i]*pa[j];
  if(i===0&&j===0)v*=1-lh*la*RHO;else if(i===0&&j===1)v*=1+lh*RHO;else if(i===1&&j===0)v*=1+la*RHO;else if(i===1&&j===1)v*=1-RHO;
  m[i][j]=v;s+=v;}}
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)m[i][j]/=s;return m;}
const TB=(function(){const t=new Float64Array(NG*NG*3);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const m=scoreMatrix(GRID[i],GRID[j]);let h=0,d=0,a=0;
  for(let x=0;x<KM;x++)for(let y=0;y<KM;y++){if(x>y)h+=m[x][y];else if(x===y)d+=m[x][y];else a+=m[x][y];}
  const k=(i*NG+j)*3;t[k]=h;t[k+1]=d;t[k+2]=a;}
 return t;})();
function targetTotal(ph,pd){const x=4.860176+49.726868*ph-33.017954*pd-55.647062*ph*ph+45.72*pd*pd-146.291582*ph*pd
 +6.616203*ph*ph*ph+35.885996*pd*pd*pd+103.161029*ph*ph*pd+97.962465*ph*pd*pd;
 return Math.min(Math.max(x,1.7),5.5);}
function fitLambda(ph,pd,pa){let mn=Infinity;const sse=new Float64Array(NG*NG);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const k=(i*NG+j)*3;
  const e=(TB[k]-ph)**2+(TB[k+1]-pd)**2+(TB[k+2]-pa)**2;sse[i*NG+j]=e;if(e<mn)mn=e;}
 const tol=mn+2e-4,tgt=targetTotal(ph,pd);let best=-1,bg=Infinity;
 for(let p=0;p<NG*NG;p++){if(sse[p]>tol)continue;const i=Math.floor(p/NG),j=p%NG;
  const g=Math.abs(GRID[i]+GRID[j]-tgt);if(g<bg){bg=g;best=p;}}
 const i=Math.floor(best/NG),j=best%NG,z=2*ph-1;
 return [GRID[i]*(1+STRETCH*z),GRID[j]*(1-STRETCH*z)];}
const SERIES=['胜胜','胜平','胜负','平胜','平平','平负','负胜','负平','负负'];
function htftDist(lh,la){const a=poisArr(S_HT*lh),b=poisArr(S_HT*la),c=poisArr((1-S_HT)*lh),d=poisArr((1-S_HT)*la);
 const out=new Array(9).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const w1=a[i]*b[j];if(w1<1e-12)continue;const s1=Math.sign(i-j);
  for(let k=0;k<KM;k++)for(let l=0;l<KM;l++){const w2=c[k]*d[l];if(w2<1e-12)continue;
   const s2=Math.sign((i+k)-(j+l));out[(1-s1)*3+(1-s2)]+=w1*w2;}}
 const s=out.reduce((x,y)=>x+y,0);return out.map(v=>v/s);}
function tier1x2(p){return p>=0.68?'高':p>=0.58?'中':p>=0.46?'低':'很低';}
function tierHtft(p){return p>=0.40?'高':p>=0.30?'中':p>=0.20?'低':'很低';}
function tierScore(p){return p>=0.33?'高':p>=0.28?'中':p>=0.23?'低':'很低';}
function upsetRisk(p){return p>=0.75?'低':p>=0.65?'较低':p>=0.55?'中':p>=0.45?'高':'极高';}

function predict(eu){const inv=eu.map(x=>1/x),s=inv.reduce((a,b)=>a+b,0),p0=inv.map(x=>x/s);
 /* 温度锐化 T=0.90：只影响显示的胜平负概率，比分/半全场矩阵仍用原始去水值 */
 const _s1=p0.map(x=>Math.pow(x,1/0.90)),_s2=_s1.reduce((a,b)=>a+b,0),p=_s1.map(x=>x/_s2);
 const L=fitLambda(p0[0],p0[1],p0[2]),lh=L[0],la=L[1],m=scoreMatrix(lh,la);
 const flat=[];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)flat.push([m[i][j],i+':'+j]);
 flat.sort((x,y)=>y[0]-x[0]);
 const tg=new Array(8).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j;tg[t>=7?7:t]+=m[i][j];}
 const hf=htftDist(lh,la),ord=hf.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
 const mx=Math.max(...p),pi=p.indexOf(mx),pickN=['主胜','平','客胜'][pi];
 const alts=[[p[0],'主胜'],[p[1],'平'],[p[2],'客胜']].filter(x=>x[1]!==pickN).sort((a,b)=>b[0]-a[0]);
 const bestIn=res=>{let b=[0,'0:0'];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const rr=i>j?'主胜':(i===j?'平':'客胜');if(rr===res&&m[i][j]>b[0])b=[m[i][j],i+':'+j];}return b;};
 let g2=0,g3=0,g4=0,best4=[0,'0:0'];
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j,v=m[i][j];
   if(t===2)g2+=v;else if(t===3)g3+=v;else if(t>=4){g4+=v;if(v>best4[0])best4=[v,i+':'+j];}}
 const risk=upsetRisk(mx);
 return {p,lh,la,pick:pickN,maxP:mx,tier:tier1x2(mx),risk,defend:(risk==='高'||risk==='极高'),
  alt1:alts[0],alt1s:bestIn(alts[0][1]),alt2:alts[1],alt2s:bestIn(alts[1][1]),
  g2,g3,g4,big4:best4,
  top3:flat.slice(0,3),p3:flat.slice(0,3).reduce((a,b)=>a+b[0],0),scoreTier:tierScore(flat.slice(0,3).reduce((a,b)=>a+b[0],0)),
  tg,peak:tg.indexOf(Math.max(...tg)),tgP:Math.max(...tg),
  hf,ord,hfFirst:ord[0],hfP:hf[ord[0]],hf3:hf[ord[0]]+hf[ord[1]]+hf[ord[2]],hfTier:tierHtft(hf[ord[0]]),
  top5:flat.slice(0,5)};}

  } else {CUR.hc=null;}

      score:r.top3[0][1],scoreP:+r.top3[0][0].toFixed(4),p3:+r.p3.toFixed(4),

      result:'',htft:'',scored:false});
    save(led);

    document.getElementById('keep').style.background='#8a8a8a';

/* ============ 台账 ============ */
function renderLedger(){
  const led=load();const box=document.getElementById('ledgerList');
  if(!led.length){box.innerHTML='<div class="empty">还没有记录<br>预测完点「存进台账」就在这</div>';return;}
  box.innerHTML=led.slice().reverse().map(it=>{
    let hit='';
    if(it.scored){
      const y=it.result.split(':').map(Number);
      const m=y[0]>y[1]?'主胜':(y[0]===y[1]?'平':'客胜');
      const ok1=m===it.pick;
      const hf=it.htft||'';
      const ok2=hf===it.hfFirst;
      const okS=it.result.replace(':','-')===it.score.replace(':','-');
      hit=`<div class="m">结果 <b>${it.result}</b> ${hf?'· '+hf:''}　
        胜平负<span class="${ok1?'hit':'miss'}">${ok1?'✓':'✗'}</span>
        半全场<span class="${ok2?'hit':'miss'}">${ok2?'✓':'✗'}</span>
        比分<span class="${okS?'hit':'miss'}">${okS?'✓':'✗'}</span></div>`;
    }
    return `<div class="item"><div class="h"><span>${it.home} vs ${it.away}</span>
      <button class="del" onclick="delItem(${it.id})">删</button></div>
      <div class="m">${it.pick} ${pct(it.p[it.pick==='主胜'?0:it.pick==='平'?1:2])}（${it.tier}）·
      半全场 ${it.hfFirst} ${pct(it.hfP)} · 比分 ${it.score} ${pct(it.scoreP)}</div>
      ${it.scored?hit:`<div class="r"><input placeholder="比分 2-1" id="r${it.id}"><input placeholder="半全场 胜胜" id="t${it.id}" style="max-width:105px"><button onclick="setResult(${it.id})">记</button></div>`}
      </div>`;
  }).join('');
  document.getElementById('storeInfo').textContent=`共 ${led.length} 场，已记结果 ${led.filter(x=>x.scored).length} 场。数据存在这台设备的浏览器里，换设备/清缓存会丢——记得导出。`;
}
window.delItem=function(id){save(load().filter(x=>x.id!==id));};
window.setResult=function(id){
  const led=load();const it=led.find(x=>x.id===id);if(!it)return;
  const s=(document.getElementById('r'+id).value||'').trim().replace(':','-');
  const t=(document.getElementById('t'+id).value||'').trim();
  if(!/^\d+-\d+$/.test(s)){alert('比分格式：2-1');return;}
  it.result=s;it.htft=t;it.scored=true;save(led);renderLedger();renderCalib();
};

/* ============ 校准 ============ */
function renderCalib(){
  const led=load().filter(x=>x.scored);const box=document.getElementById('calibBox');
  if(!led.length){box.innerHTML='<div class="empty">还没有已记结果的场次</div>';return;}
  const grp={};let ok1=0,ok2=0,okS=0;
  led.forEach(it=>{
    const y=it.result.split('-').map(Number);
    const m=y[0]>y[1]?'主胜':(y[0]===y[1]?'平':'客胜');
    const a=m===it.pick,b=it.htft===it.hfFirst,c=it.result===it.score.replace(':','-');
    ok1+=a;ok2+=b;okS+=c;
    grp[it.tier]=grp[it.tier]||{n:0,h:0};grp[it.tier].n++;grp[it.tier].h+=a?1:0;
  });
  const n=led.length;
  let h=`<div class="title">校准（${n} 场）</div>
   <div class="stat"><span>胜平负命中</span><b>${ok1}/${n}（${(ok1/n*100).toFixed(1)}%）</b></div>
   <div class="stat"><span>半全场首选</span><b>${ok2}/${n}（${(ok2/n*100).toFixed(1)}%）</b></div>
   <div class="stat"><span>比分首选</span><b>${okS}/${n}（${(okS/n*100).toFixed(1)}%）</b></div>
   <div class="tip">历史基准：胜平负 55%、半全场 34%、比分 12%</div>`;
  h+=`<div class="title" style="margin-top:14px">按把握度</div>`;
  ['高','中','低','很低'].forEach(t=>{
    if(!grp[t])return;
    h+=`<div class="stat"><span>${t}</span><b>${grp[t].h}/${grp[t].n}（${(grp[t].h/grp[t].n*100).toFixed(0)}%）</b></div>`;
  });
  box.innerHTML=h;
}


/* ============ 今日推荐（2串1 / 3串1） ============ */
let REC_LEGS = 2;

function recPredictions() {
  const out = [];
  for (const m of ODDS) {
    if (m.st !== 'Selling' || !m.eu) continue;
    try { out.push({ m: m, r: predict(m.eu) }); } catch (e) {}
  }
  return out;
}

function renderRec() {
  const box = document.getElementById('recBody');
  if (!box) return;
  const all = recPredictions();
  document.getElementById('recCount').textContent = all.length ? (all.length + ' 场可算') : '';
  if (!all.length) {
    box.innerHTML = '<div class="card"><div class="tip">还没有比赛数据。回「预测」页点「拉取官网」。</div></div>';
    return;
  }
  const POOLS = [
    { name: '胜平负', thr: 0.60, tag: '≥60%',
      pick: x => ({ txt: x.r.pick, p: x.r.maxP, detail: '' }) },
    { name: '半全场', thr: 0.40, tag: '≥40%',
      pick: x => ({ txt: SERIES[x.r.hfFirst], p: x.r.hfP, detail: '次选 ' + SERIES[x.r.ord[1]] + ' ' + (x.r.hf[x.r.ord[1]] * 100).toFixed(0) + '%' }) },
    { name: '比分', thr: 0.28, tag: '前三合计≥28%',
      pick: x => ({ txt: x.r.top3[0][1], p: x.r.top3[0][0], detail: '前三合计 ' + (x.r.p3 * 100).toFixed(0) + '%　前五 ' + x.r.top5.map(y => y[1]).join(' / ') }) }
  ];
  let h = '';
  for (const pool of POOLS) {
    const list = all.map(x => { const pk = pool.pick(x); return { m: x.m, r: x.r, txt: pk.txt, p: pk.p, detail: pk.detail }; })
      .filter(x => {
        if (pool.name === '比分') return x.r.p3 >= pool.thr;
        return x.p >= pool.thr;
      })
      .sort((a, b) => b.p - a.p);
    h += '<div class="card"><div class="title"><span>' + pool.name + '</span>' +

           '<div class="pk"><span>' + x.txt + '</span><b>' + (x.p * 100).toFixed(1) + '%</b></div>' +
           (x.detail ? '<div class="dt">' + x.detail + '</div>' : '') + '</div>';
    });

/* ============ 近期状态（交锋 + 近5场） ============ */
function statRecent(list, teamIsHome) {
  if (!list || !list.length) return null;
  let w = 0, d = 0, l = 0, gf = 0, ga = 0, htHit = 0, n = 0;
  for (const x of list) {
    if (!x || !x.score) continue;
    const home = (x.venue === '主');
    const a = +x.score[0], b = +x.score[1];
    if (!isFinite(a) || !isFinite(b)) continue;
    const my = home ? a : b, opp = home ? b : a;
    gf += my; ga += opp; n++;
    if (x.ht && x.ht.length === 2) {
      const h1 = home ? +x.ht[0] : +x.ht[1], a1 = home ? +x.ht[1] : +x.ht[0];
      if (h1 + a1 > 0) htHit++;
    }
    if (x.result === '胜') w++; else if (x.result === '平') d++; else l++;
  }
  if (!n) return null;
  return { n: n, w: w, d: d, l: l, gf: gf / n, ga: ga / n, tot: (gf + ga) / n, ht: htHit / n };
}

function statH2H(list, homeName) {
  if (!list || !list.length) return null;
  let w = 0, d = 0, l = 0, tot = 0, n = 0;
  for (const x of list) {
    if (!x || !x.score) continue;
    const a = +x.score[0], b = +x.score[1];
    if (!isFinite(a) || !isFinite(b)) continue;
    const mine = (x.home === homeName);
    const my = mine ? a : b, opp = mine ? b : a;
    tot += a + b; n++;
    if (my > opp) w++; else if (my === opp) d++; else l++;
  }
  if (!n) return null;
  return { n: n, w: w, d: d, l: l, tot: tot / n };
}

function renderRecent(m) {
  const card = document.getElementById('recentCard');
  const box = document.getElementById('recentBody');
  if (!card || !box) return;
  if (!m || (!m.recent && !m.h2h)) { card.style.display = 'none'; return; }
  const fh = statRecent((m.recent || {}).home, true);
  const fa = statRecent((m.recent || {}).away, false);
  const hh = statH2H(m.h2h, m.h);
  let h = '';
  const line = (name, s) => {
    if (!s) return '<div class="rs"><span class="who">' + name + '</span><span class="rec">暂无数据</span></div>';
    return '<div class="rs"><span><span class="who">' + name + '</span>' +
      '<span class="rec">' + s.w + '胜' + s.d + '平' + s.l + '负</span></span>' +
      '<span class="num">均' + s.tot.toFixed(1) + '球</span></div>' +
      '<div class="tip">进 ' + s.gf.toFixed(1) + ' / 失 ' + s.ga.toFixed(1) +
      '　上半场有进球 ' + (s.ht * 100).toFixed(0) + '%</div>';
  };
  h += line(m.h + '（近5场）', fh);
  h += line(m.a + '（近5场）', fa);
  if (hh) {
    h += '<div class="rs" style="margin-top:6px"><span class="who">交锋</span>' +
      '<span class="rec">' + hh.n + ' 次　' + m.h + ' ' + hh.w + '胜' + hh.d + '平' + hh.l + '负</span>' +
      '<span class="num">均' + hh.tot.toFixed(1) + '球</span></div>';
  }
  // 形态回查：用竞彩赔率算形态，再查 5,913 场历史统计
  try {
    const hd = (m.raw || {}).had || {};
    if (hd.h && hd.d && hd.a) {
      const cd = [hd.h, hd.d, hd.a].map(x => Math.min(Math.floor(+x), 9)).join('');
      const st = (STATS.dims.jc || {})[cd];
      if (st) {
        h += '<div class="rs" style="margin-top:8px;border-top:1px solid #eef2f7">' +
             '<span class="who">竞彩形态 ' + cd + '</span>' +
             '<span class="rec">历史 ' + st.n + ' 场</span>' +
             '<span class="num">均' + st.avg + '球</span></div>' +
             '<div class="tip">主 ' + Math.round(st.w * 100) + '%　平 ' +
             Math.round(st.d * 100) + '%　客 ' + Math.round(st.l * 100) +
             '%　｜　最常见 ' + st.top[0][0] + ' ' + (st.top[0][1] * 100).toFixed(0) + '%</div>';
      }
    }
  } catch (e) {}


  // 分析结论：让球解读 + 半场提示
  try {
    const mp2 = (m.raw || {}).marketProb && ((m.raw.marketProb).live || (m.raw.marketProb).open);
    const ln = parseFloat(((m.raw || {}).hhad || {}).goalLine);
    if (mp2 && Stats_rules() && Stats_rules().hdc && isFinite(ln)) {
      const ph = mp2[0], pa = mp2[2];
      const strongHome = ph >= pa;
      const pStrong = Math.max(ph, pa);
      const key = rKey(ln);
      h += '<div class="tip" style="margin-top:10px;border-top:1px solid #eef2f7;padding-top:10px">' +
           '<b style="color:#0B1F33">分析</b></div>';
      if (key) {
        const g = Stats_rules().hdc[key];
        const mag = key === "4+" ? 4 : parseInt(key);
        const band = pickBand(pStrong, key);
        h += '<div class="tip">让' + mag + '球（' + (strongHome ? m.h : m.a) + ' 是强队，胜率 ' +
             Math.round(pStrong * 100) + '%）</div>';
        const b = band || [null, null, g.pierce, g.push, g.miss];
        h += '<div class="three" style="margin-top:8px">' +
             '<div><div class="v" style="color:#2E7D32">' + Math.round(b[2] * 100) + '%</div><div class="k">打穿</div></div>' +
             '<div><div class="v" style="color:#C79100">' + Math.round(b[3] * 100) + '%</div><div class="k">让平</div></div>' +
             '<div><div class="v" style="color:#C0504D">' + Math.round(b[4] * 100) + '%</div><div class="k">没让赢</div></div>' +
             '</div>';
        const src = band ? (band[1] + ' 场同档') : (g.n + ' 场全部');
        h += '<div class="tip" style="margin-top:8px">' + src + '比赛的实际占比，不是模型预测</div>';
      } else {
        h += '<div class="tip">这场没有让球数据</div>';
      }
      const H = Stats_rules().half;
      if (H) {
        h += '<div class="tip" style="margin-top:8px">半场打平 ' + Math.round(H.draw * 100) +
             '%，其中 0:0 占 ' + Math.round(H.zero * 100) + '%</div>';
      }
    }
  } catch (e) {}
  
  // 盘型组合回查
  try {
    const hd2 = (m.raw || {}).hhad || {};
    const mp3 = (m.raw || {}).marketProb && ((m.raw.marketProb).live || (m.raw.marketProb).open);
    const ln2 = parseFloat(hd2.goalLine);
    if (mp3 && isFinite(ln2) && hd2.h && Stats_rules().combo) {
      const eu3 = [mp3[0], mp3[1], mp3[2]].map(p => Math.min(Math.floor((1 / p) * 0.938), 9)).join('');
      const hc3 = [hd2.h, hd2.d, hd2.a].map(x => Math.min(Math.floor(parseFloat(x)), 9)).join('');
      const key3 = eu3 + '/' + (ln2 > 0 ? '+' + ln2 : ln2) + '/' + hc3;
      const cb = Stats_rules().combo[key3];
      if (cb) {
        const mx3 = Math.max(cb[1], cb[2], cb[3]);
        h += '<div class="tip" style="margin-top:10px;border-top:1px solid #eef2f7;padding-top:10px">' +
             '<b style="color:#0B1F33">盘型组合 ' + key3 + '</b>' +
             '　<span style="color:#94A1B2">' + cb[0] + ' 场</span></div>';
        h += '<div class="three" style="margin-top:8px">' +
             '<div' + (cb[1] === mx3 ? ' style="outline:1.5px solid #0E6B66"' : '') +
             '><div class="v">' + Math.round(cb[1] * 100) + '%</div><div class="k">让胜</div></div>' +
             '<div' + (cb[2] === mx3 ? ' style="outline:1.5px solid #0E6B66"' : '') +
             '><div class="v">' + Math.round(cb[2] * 100) + '%</div><div class="k">让平</div></div>' +
             '<div' + (cb[3] === mx3 ? ' style="outline:1.5px solid #0E6B66"' : '') +
             '><div class="v">' + Math.round(cb[3] * 100) + '%</div><div class="k">让负</div></div>' +
             '</div>';
      }
    }
  } catch (e) {}


  // 筛选信号：让胜 / 让平 / 让负
  try {
    const Rp = Stats_rules().pick;
    const mp2 = (m.raw || {}).marketProb && ((m.raw.marketProb).live || (m.raw.marketProb).open);
    const ln = parseFloat(((m.raw || {}).hhad || {}).goalLine);
    if (Rp && mp2 && isFinite(ln)) {
      const L0 = fitLambda(mp2[0], mp2[1], mp2[2]);
      const G0 = scoreMatrix(L0[0], L0[1]);
      let pW = 0, pU = 0, pL = 0;
      for (let a = 0; a < G0.length; a++) {
        for (let b = 0; b < G0[a].length; b++) {
          const g = a - b + ln;
          if (g > 0) pW += G0[a][b];
          else if (g === 0) pU += G0[a][b];
          else pL += G0[a][b];
        }
      }
      // 组合三率
      const hdd = (m.raw || {}).hhad || {};
      const mp4 = (m.raw || {}).marketProb && ((m.raw.marketProb).live || (m.raw.marketProb).open);
      let key4 = null, cb = null;
      if (mp4 && hdd.h) {
        const eu4 = [mp4[0], mp4[1], mp4[2]].map(p => Math.min(Math.floor((1 / p) * 0.938), 9)).join('');
        const hc4 = [hdd.h, hdd.d, hdd.a].map(x => Math.min(Math.floor(parseFloat(x)), 9)).join('');
        key4 = eu4 + '/' + (ln > 0 ? '+' + ln : ln) + '/' + hc4;
        cb = Stats_rules().combo[key4];
      }
      const w5 = Rp.pcut.W.top5, u5 = Rp.pcut.U.top5, l5 = Rp.pcut.L.top5;
      const hitW = pW >= w5 && cb && cb[1] >= Rp.cut.W;
      const hitU = pU >= u5;
      const hitL = pL >= l5 && cb && cb[3] >= Rp.cut.L;
      const any = hitW || hitU || hitL;
      h += '<div class="tip" style="margin-top:10px;border-top:1px solid #eef2f7;padding-top:10px">' +
           '<b style="color:#0B1F33">筛选信号</b>　<span style="color:#94A1B2">' +
           (any ? '有触发' : '无') + '</span></div>';
      const sig = (name, on, txt) =>
        '<div class="strow" style="padding:8px 4px"><span style="flex:1;font-size:15px;' +
        (on ? 'font-weight:700;color:#0B1F33' : 'color:#94A1B2') + '">' + name + '</span>' +
        '<span style="' + (on ? 'font-weight:700;color:#0E6B66' : 'color:#94A1B2') +
        ';font-size:15px">' + (on ? '✓' : '—') + '</span>' +
        '<span style="width:150px;text-align:right;font-size:12.5px;color:#94A1B2">' + txt + '</span></div>';
      h += sig('让胜', hitW, '模型 ' + Math.round(pW * 100) + '%' +
               (cb ? ' / 组合 ' + Math.round(cb[1] * 100) + '%' : ''));
      h += sig('让平', hitU, '模型 ' + Math.round(pU * 100) + '%');
      h += sig('让负', hitL, '模型 ' + Math.round(pL * 100) + '%' +
               (cb ? ' / 组合 ' + Math.round(cb[3] * 100) + '%' : ''));
      const S = Rp.summary || [];
      if (S.length) {
        h += '<div class="tip" style="margin-top:8px;font-size:12px;line-height:1.8">' +
             '全库历史：' + S.map(x => x[0] + ' 命中' + Math.round(x[2]*100) + '% → 回报' + x[4].toFixed(2)).join('　') +
             '<br>阈值来自 5,856 场。让平只用模型（组合筛选有害）</div>';
      }
    }
  } catch (e) {}

  box.innerHTML = h;
  document.getElementById('recentTip').textContent = '近5场来自官网，不是体彩赛程';
  card.style.display = '';
}


/* ============ 导出今日快照 ============ */
function exportSnapshot() {
  const c = oddsCache();
  const list = (c && c.list) || ODDS || [];
  const use = list.filter(m => m.raw && m.raw.home && m.raw.away);
  if (!use.length) { alert('还没有数据。先点「拉取官网」。'); return; }
  const now = new Date();
  const p2 = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) +
                ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
  const payload = {
    app: '澜枢', version: 1,
    exportedAt: now.toISOString(),
    snapshotAt: stamp,
    matches: use.map(m => m.raw)
  };
  const text = JSON.stringify(payload, null, 1);
  const name = '澜枢快照_' + stamp.replace(' ', '_').replace(':', '') + '.json';
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    alert('已导出：' + name + '\n\n共 ' + use.length + ' 场。\n把这个文件发给我就行。');
  } catch (e) {
    alert('导出失败：' + e.message);
  }
}



/* ============ 汇总（赛事 / 指数 / 历史） ============ */
let SUM_VIEW = 'match';
let SUM_F = { eu: null, ou: null, hd: null };   // 当前选中的盘型

function codeOf(o) {
  if (!o) return '';
  const a = [o.h, o.d, o.a].map(x => {
    const v = parseFloat(x);
    return isFinite(v) ? Math.min(Math.floor(v), 9) : '-';
  });
  return a.join('');
}

function euCode(raw) {
  // 欧赔形态：marketProb 是无抽水的隐含概率，乘回 0.938 的返还率才接近真实欧赔
  const mp = raw && raw.marketProb && (raw.marketProb.live || raw.marketProb.open);
  if (!mp) return '';
  const o = mp.map(p => (1 / p) * 0.938);
  return o.map(v => Math.min(Math.floor(v), 9)).join('');
}

function todayMatches() {
  const out = [];
  for (const m of ODDS) {
    const raw = m.raw || {};
    out.push({
      m: m,
      eu: euCode(raw),
      ou: codeOf(raw.had),
      hd: codeOf(raw.hhad),
      line: (raw.hhad || {}).goalLine || ''
    });
  }
  return out;
}

function pass(m) {
  if (SUM_F.eu && m.eu !== SUM_F.eu) return false;
  if (SUM_F.ou && m.ou !== SUM_F.ou) return false;
  if (SUM_F.hd && m.hd !== SUM_F.hd) return false;
  return true;
}

function chipRow(title, dim, all, pickFn) {
  const cnt = {};
  for (const x of all) { const k = pickFn(x); if (k) cnt[k] = (cnt[k] || 0) + 1; }
  const total = Object.keys(cnt).reduce((s, k) => s + cnt[k], 0);
  let h = '<div class="sumsec">' + title + '（' + total + ' 场）</div><div class="chips">';
  const keys = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  if (!keys.length) h += '<span class="tip">暂无</span>';
  for (const k of keys) {
    const on = SUM_F[dim] === k ? ' on' : '';
    h += '<button class="chip' + on + '" onclick="sumPick(\'' + dim + '\',\'' + k + '\')">' +
         '<b>' + k + '</b><s>' + cnt[k] + '</s></button>';
  }
  h += '</div>';
  return h;
}

function renderSum() {
  const box = document.getElementById('sumBody');
  const tip = document.getElementById('sumTip');
  if (!box) return;
  const all = todayMatches();
  if (!all.length) {
    box.innerHTML = '<div class="card"><div class="tip">还没有比赛数据。回「预测」页点「拉取」。</div></div>';
    tip.textContent = '';
    return;
  }
  if (SUM_VIEW === 'hist') {
    tip.textContent = STATS.N.toLocaleString() + ' 场历史 · 可选全部/近一年';
    box.innerHTML = '<div class="card" id="statList"></div><div class="card" id="statDetail" style="display:none"></div>';
    renderStatList();
    return;
  }
  if (SUM_VIEW === 'index') {
    tip.textContent = '点一个盘型筛选（同组只能选一个，不同组取交集）';
    let h = '<div class="card">';
    h += chipRow('欧赔盘型', 'eu', all, x => x.eu);
    h += chipRow('竞彩胜平负', 'ou', all, x => x.ou);
    h += chipRow('让球盘型', 'hd', all, x => x.hd);
    const n = all.filter(pass).length;
    const sel = [];
    if (SUM_F.eu) sel.push('欧赔 ' + SUM_F.eu);
    if (SUM_F.ou) sel.push('竞彩 ' + SUM_F.ou);
    if (SUM_F.hd) sel.push('让球 ' + SUM_F.hd);
    h += '<div class="tip" style="margin-top:14px">已选：' + (sel.length ? sel.join(' · ') : '无') +
         '　→　命中 ' + n + ' 场' +
         (sel.length ? '<br><button class="mini" style="margin-top:10px" onclick="sumClear()">清除筛选</button>' : '') +
         '</div>';
    // 选中欧赔码时，带上库里的历史统计
    if (SUM_F.eu) {
      const st = (STATS.windows.all.dims.ou || {})[SUM_F.eu];
      if (st) {
        h += '<div class="tip" style="margin-top:10px;border-top:1px solid #eef2f7;padding-top:10px">' +
             '库里这个码（' + st.n + ' 场）：主 ' + Math.round(st.w * 100) + '%　平 ' +
             Math.round(st.d * 100) + '%　客 ' + Math.round(st.l * 100) +
             '%　｜　场均 ' + st.avg + ' 球　｜　最常见 ' + st.top[0][0] + ' ' +
             (st.top[0][1] * 100).toFixed(0) + '%</div>';
      }
    }
    h += '</div>';
    box.innerHTML = h;
    return;
  }
  // 赛事汇总
  const list = all.filter(pass);
  tip.textContent = '共 ' + all.length + ' 场，筛选后 ' + list.length + ' 场';
  let h = '';
  if (!list.length) {
    h = '<div class="card"><div class="tip">没有符合条件的场次。</div></div>';
  } else {
    h = '<div class="card">';
    for (const x of list) {
      const m = x.m;
      const mp = (m.raw && m.raw.marketProb && (m.raw.marketProb.live || m.raw.marketProb.open));
      const euTxt = mp ? mp.map(p => (1 / p).toFixed(2)).join(' / ') : (m.euTxt || '—');
      h += '<div class="sc" onclick="sumOpen(\'' + m.num + '\')">' +

    }
    h += '</div>';
  }
  box.innerHTML = h;
}

window.sumPick = function (dim, k) {
  SUM_F[dim] = (SUM_F[dim] === k) ? null : k;
  renderSum();
};
window.sumClear = function () { SUM_F = { eu: null, ou: null, hd: null }; renderSum(); };
window.sumOpen = function (num) {
  const i = ODDS.findIndex(x => x.num === num);
  if (i >= 0) {
    document.querySelectorAll('.tabs button').forEach(x => {
      if (x.dataset.t === 'pred') x.click();
    });
    setTimeout(() => window.pickOdds(i), 120);
  }
};

document.querySelectorAll('#sum .seg button').forEach(b => {

    document.querySelectorAll('#sum .seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    SUM_VIEW = b.dataset.s;
    renderSum();
  };
});

let STAT_DIM = 'ou';
let STAT_WIN = 'all';

function winData() { return (STATS.windows[STAT_WIN] || STATS.windows.all); }

function renderStatList() {
  const box = document.getElementById('statList');
  if (!box) return;
  const w = winData();
  const m = w.dims[STAT_DIM] || {};
  const keys = Object.keys(m).sort((a, b) => m[b].n - m[a].n);
  const r7 = STATS.recent7 || {};
  let h = '';
  if (r7.N) {
    h += '<div class="gl"><span class="k">近 7 天（' + r7.from.slice(5) + '~' + r7.to.slice(5) +
         '，' + r7.N + ' 场）</span><span class="v">均' + r7.avg + '球<em>4+ ' +
         Math.round(r7.b4 * 100) + '%</em></span></div>';
    h += '<div class="tip">主 ' + Math.round(r7.w * 100) + '%　平 ' +
         Math.round(r7.d * 100) + '%　客 ' + Math.round(r7.l * 100) + '%</div>';
  }
  h += '<div class="seg" style="margin-top:14px">' +
       '<button class="' + (STAT_WIN === 'all' ? 'on' : '') + '" onclick="setWin(\'all\')">全部 ' + STATS.N + ' 场</button>' +
       '<button class="' + (STAT_WIN === 'y1' ? 'on' : '') + '" onclick="setWin(\'y1\')">近一年 ' + (STATS.windows.y1 || {}).N + ' 场</button>' +
       '</div>';
  h += '<div class="seg" style="margin-top:8px">' +
       ['ou', 'jc', 'hdc'].map(d => '<button class="' + (STAT_DIM === d ? 'on' : '') +
         '" onclick="setDim(\'' + d + '\')">' + ({ ou: '欧赔', jc: '竞彩', hdc: '让球' })[d] + '</button>').join('') +
       '</div>';
  if (!keys.length) {
    h += '<div class="tip" style="margin-top:12px">这个窗口里没有足够样本的形态。</div>';
  } else {
    h += '<div style="margin-top:10px">';
    for (const k of keys) {
      const s = m[k];
      h += '<div class="strow" onclick="showStat(\'' + k + '\')">' +
           '<span class="stcode">' + k + '</span>' +
           '<span class="stbar"><i class="w" style="width:' + (s.w * 100) + '%"></i>' +
           '<i class="d" style="width:' + (s.d * 100) + '%"></i>' +
           '<i class="l" style="width:' + (s.l * 100) + '%"></i></span>' +
           '<span class="stn">' + s.n + '场</span></div>';
    }
    h += '</div>';
  }
  if (STATS.matches && STATS.matches.length) {
    h += '<div class="sumsec" style="margin-top:16px">最近赛事（' + STATS.matches.length + ' 条）</div>';
    h += '<div class="tip">日期 · 场次 · 联赛 · 对阵 · 欧赔码/让球码 · 比分</div>';
    for (const x of STATS.matches) {
      h += '<div class="strow" style="font-size:13px;gap:6px">' +
           '<span style="color:#8a95a3;width:42px">' + x[0] + '</span>' +
           '<span style="width:52px;color:#6b7785">' + x[1] + '</span>' +
           '<span style="flex:1">' + x[3] + ' vs ' + x[4] + '</span>' +
           '<span style="width:60px;text-align:right;color:#0E6B66;font-weight:600">' + x[5] + '</span>' +
           '<span style="width:44px;text-align:right;color:#0B1F33">' + x[7] + '</span></div>';
    }
  }
  box.innerHTML = h;
}

window.setWin = function (w) { STAT_WIN = w; renderStatList(); };
window.setDim = function (d) { STAT_DIM = d; renderStatList(); };

window.showStat = function (code) {
  const det = document.getElementById('statDetail');
  if (!det) return;
  const s = (winData().dims[STAT_DIM] || {})[code];
  if (!s) return;
  let h = '<div class="title"><span>' + code + '　' + s.n + ' 场</span>' +
          '<span class="tip">场均 ' + s.avg + ' 球</span></div>';

       '<div><div class="v">' + Math.round(s.w * 100) + '%</div><div class="k">主胜</div></div>' +

  h += '<div class="tip" style="margin:12px 0 4px">总进球分布</div>';

  const hfTop = s.hf.slice().sort((a, b) => b[1] - a[1]).slice(0, 3);
  h += '<div class="tip" style="margin:12px 0 0">半全场前三：' +
       hfTop.map(x => x[0] + ' ' + (x[1] * 100).toFixed(1) + '%').join('　·　') + '</div>';
  det.innerHTML = h;
  det.style.display = '';
  det.scrollIntoView({ behavior: 'smooth', block: 'start' });
};



/* ============ 规律速查 v2 ============ */
const HDC_TITLE = { "1": "让一球", "2": "让两球", "3": "让三球", "4+": "让四球以上" };

function renderRules() {
  const box = document.getElementById('sumBody');
  const tip = document.getElementById('sumTip');
  if (!box) return;
  const R = STATS.rules;
  if (!R || !R.hdc) { box.innerHTML = '<div class="card"><div class="tip">没有规律数据</div></div>'; return; }
  tip.textContent = '这些是从 ' + STATS.N.toLocaleString() + ' 场实测里数出来的，不是模型算的';
  let h = '';

  for (const key of ["1", "2", "3", "4+"]) {
    const g = R.hdc[key];
    if (!g) continue;
    const mag = key === "4+" ? 4 : parseInt(key);
    h += '<div class="card"><div class="title"><span>' + HDC_TITLE[key] + '，最后赢几个</span>' +
         '<span class="tip">' + g.n + ' 场</span></div>';
    if (g.n < 100) {
      h += '<div class="tip" style="color:#C0504D;margin-bottom:8px">⚠ 样本只有 ' + g.n +
           ' 场，数字仅供参考，别当规律用</div>';
    }
    const pierceTxt = mag === 4 ? '赢5球以上' : ('赢' + (mag + 1) + '球以上');
    h += '<div class="three"><div><div class="v" style="color:#2E7D32">' + Math.round(g.pierce * 100) +
         '%</div><div class="k">打穿 ' + pierceTxt + '</div></div>' +
         '<div><div class="v" style="color:#C79100">' + Math.round(g.push * 100) +
         '%</div><div class="k">让平 正好赢' + mag + '</div></div>' +
         '<div><div class="v" style="color:#C0504D">' + Math.round(g.miss * 100) +
         '%</div><div class="k">没让赢</div></div></div>';
    h += '<div class="tip" style="margin-top:8px">强队净胜球平均 ' + g.avg_margin +
         ' 个，场均 ' + g.avg_goals + ' 球</div>';
    if (g.bands.length) {
      h += '<div class="strow" style="font-size:12.5px;color:#7A8797;padding:10px 4px 6px">' +
           '<span style="flex:1">强队胜率</span><span style="width:50px;text-align:right">场次</span>' +
           '<span style="width:56px;text-align:right">打穿</span><span style="width:56px;text-align:right">让平</span>' +
           '<span style="width:56px;text-align:right">没赢</span></div>';
      for (const b of g.bands) {
        h += '<div class="strow" style="padding:8px 4px">' +
             '<span style="flex:1;font-size:14.5px">' + b[0] + '</span>' +
             '<span style="width:50px;text-align:right;font-size:12.5px;color:#94A1B2">' + b[1] + '</span>' +
             '<span style="width:56px;text-align:right;font-weight:700;color:#2E7D32;font-size:14.5px">' + Math.round(b[2]*100) + '%</span>' +
             '<span style="width:56px;text-align:right;font-weight:700;color:#C79100;font-size:14.5px">' + Math.round(b[3]*100) + '%</span>' +
             '<span style="width:56px;text-align:right;font-weight:700;color:#C0504D;font-size:14.5px">' + Math.round(b[4]*100) + '%</span></div>';
      }
    }
    if (g.scores && g.scores.length) {
      h += '<div class="tip" style="margin-top:10px">最常见比分：' +
           g.scores.map(x => x[0] + ' ' + (x[1]*100).toFixed(0) + '%').join('　·　') + '</div>';
    }
    h += '</div>';
  }

  // 让一球 vs 让两球 对比
  if (R.hdc["1"] && R.hdc["2"]) {
    const a = R.hdc["1"], b = R.hdc["2"];
    h += '<div class="card"><div class="title"><span>让一球 vs 让两球</span></div>';
    h += '<div class="strow" style="font-size:13px;color:#7A8797"><span style="flex:1"></span>' +
         '<span style="width:80px;text-align:right">让1球</span><span style="width:80px;text-align:right">让2球</span></div>';
    const row = (lab, x, y) => '<div class="strow"><span style="flex:1;font-size:15px">' + lab + '</span>' +
         '<span style="width:80px;text-align:right;font-weight:700;font-size:15px">' + x + '</span>' +
         '<span style="width:80px;text-align:right;font-weight:700;font-size:15px">' + y + '</span></div>';
    h += row('打穿', Math.round(a.pierce*100)+'%', Math.round(b.pierce*100)+'%');
    h += row('让平', Math.round(a.push*100)+'%', Math.round(b.push*100)+'%');
    h += row('没让赢', Math.round(a.miss*100)+'%', Math.round(b.miss*100)+'%');
    h += row('场均进球', a.avg_goals, b.avg_goals);
    h += '<div class="tip" style="margin-top:10px">让两球是「赌赢几个」，让一球是「赌赢不赢」</div></div>';
  }


  // 盘型组合表
  if (R.combo) {
    const arr = Object.keys(R.combo).map(k => [k, R.combo[k]]);
    arr.sort((a, b) => Math.max(b[1][1], b[1][2], b[1][3]) - Math.max(a[1][1], a[1][2], a[1][3]));
    h += '<div class="card"><div class="title"><span>同样盘型，让球偏向哪边</span>' +
         '<span class="tip">' + arr.length + ' 组</span></div>';
    h += '<div class="tip" style="margin-bottom:8px">组合 = 欧赔码 / 让球线 / 让球码。每组至少 25 场</div>';
    h += '<div class="strow" style="font-size:12.5px;color:#7A8797;padding-bottom:6px">' +
         '<span style="flex:1">组合</span><span style="width:44px;text-align:right">场次</span>' +
         '<span style="width:50px;text-align:right">让胜</span><span style="width:50px;text-align:right">让平</span>' +
         '<span style="width:50px;text-align:right">让负</span></div>';
    const N = 40;
    for (let i = 0; i < Math.min(N, arr.length); i++) {
      const [k, v] = arr[i];
      const mx = Math.max(v[1], v[2], v[3]);
      const col = (x) => x === mx ? 'font-weight:700;color:#0B1F33' : 'color:#94A1B2';
      h += '<div class="strow" style="padding:8px 4px">' +
           '<span style="flex:1;font-size:14.5px;font-family:monospace">' + k + '</span>' +
           '<span style="width:44px;text-align:right;font-size:12px;color:#94A1B2">' + v[0] + '</span>' +
           '<span style="width:50px;text-align:right;font-size:14px;' + col(v[1]) + '">' + Math.round(v[1]*100) + '%</span>' +
           '<span style="width:50px;text-align:right;font-size:14px;' + col(v[2]) + '">' + Math.round(v[2]*100) + '%</span>' +
           '<span style="width:50px;text-align:right;font-size:14px;' + col(v[3]) + '">' + Math.round(v[3]*100) + '%</span></div>';
    }
    h += '<div class="tip" style="margin-top:10px">加粗=该组合历史上最常出现的那一项。' +
         '偏得越狠（如 232/−1/641 的 82%），越说明这个盘型组合有明确方向</div>';
    h += '<div class="tip" style="margin-top:6px;color:#C0504D">注意：验证集实测比表里低约 3pp，' +
         '而且命中率高时赔率就低，整体回报仍在 0.90 左右</div></div>';
  }

  // 低赔大热
  const B = R.bigfav;
  h += '<div class="card"><div class="title"><span>低赔大热（主队 ' + B.range + '）</span>' +
       '<span class="tip">' + B.n + ' 场</span></div>';
  h += '<div class="three"><div><div class="v">' + Math.round(B.win*100) + '%</div><div class="k">主胜</div></div>' +
       '<div><div class="v">' + Math.round(B.draw*100) + '%</div><div class="k">被追平</div></div>' +
       '<div><div class="v">' + Math.round(B.lose*100) + '%</div><div class="k">被打败</div></div></div>';
  h += '<div class="tip" style="margin-top:10px">没中的七成是被追平，不是被打败</div></div>';

  // 半场
  const H = R.half;
  h += '<div class="card"><div class="title"><span>半场会怎样</span><span class="tip">' + H.n + ' 场</span></div>';
  h += '<div class="three"><div><div class="v">' + Math.round(H.draw*100) + '%</div><div class="k">半场平</div></div>' +
       '<div><div class="v">' + Math.round(H.zero*100) + '%</div><div class="k">半场0:0</div></div>' +
       '<div><div class="v">' + Math.round(H.lead*100) + '%</div><div class="k">半场分胜负</div></div></div>';
  h += '<div class="tip" style="margin-top:10px">所以半全场预测「某队领先」时，约四成会被打平</div></div>';

  // 比分
  h += '<div class="card"><div class="title"><span>最常出现的比分</span>' +
       '<span class="tip">全部 ' + STATS.N.toLocaleString() + ' 场</span></div>';
  const mx = R.scores[0][1];
  for (const [sc, p] of R.scores) {
    h += '<div class="barrow"><span class="k">' + sc + '</span>' +
         '<span class="b"><i style="width:' + (p/mx*100) + '%"></i></span>' +
         '<span class="v">' + (p*100).toFixed(1) + '%</span></div>';
  }
  h += '<div class="tip" style="margin-top:10px">前 8 个比分合计约 ' +
       Math.round(R.scores.reduce((s, x) => s + x[1], 0) * 100) + '%</div></div>';

  // 平局拆解
  h += '<div class="card"><div class="title"><span>打平的时候，几比几</span></div>';
  for (const [sc, p] of R.drawsplit) {
    h += '<div class="barrow"><span class="k">' + sc + '</span>' +
         '<span class="b"><i style="width:' + (p/R.drawsplit[0][1]*100) + '%"></i></span>' +
         '<span class="v">' + (p*100).toFixed(1) + '%</span></div>';
  }
  h += '<div class="tip" style="margin-top:10px">这里的分母是「平局」，不是全部比赛</div></div>';

  box.innerHTML = h;
}


function Stats_rules() { return STATS.rules; }
function rKey(line) {
  const a = Math.abs(line);
  if (a === 1) return "1";
  if (a === 2) return "2";
  if (a === 3) return "3";
  if (a >= 4) return "4+";
  return null;
}
function pickBand(p, key) {
  const g = (STATS.rules && STATS.rules.hdc) ? STATS.rules.hdc[key] : null;
  if (!g || !g.bands || !g.bands.length) return null;
  for (const b of g.bands) {
    const m = b[0].match(/(\d+)–(\d+)%/);
    if (!m) continue;
    const lo = +m[1] / 100, hi = +m[2] / 100;
    if (p >= lo - 1e-9 && p < hi + 1e-9) return b;
  }
  return g.bands[g.bands.length - 1];
}

/* ============ 官网在售（云函数，含欧赔/Coral/让球） ============ */
const API='https://jcdata-pxigzkgjcb.cn-hangzhou.fcapp.run?t=1';
const ODDS_KEY='jc_odds_v2';
const TTL_NORMAL=12*3600*1000;   // 平时 12 小时
const TTL_CLOSE=30*60*1000;      // 停售前一小时 30 分钟
let ODDS=[];

function inCloseWin(){
  const d=new Date(), wd=d.getDay();
  return d.getHours()===((wd===0||wd===6)?22:21);
}
function ttlNow(){ return inCloseWin()?TTL_CLOSE:TTL_NORMAL; }
function oddsCache(){try{return JSON.parse(localStorage.getItem(ODDS_KEY)||'null')}catch(e){return null}}
function cacheFresh(c){ return !!(c && c.t && (Date.now()-c.t)<ttlNow()); }

function renderOdds(data){
  const box=document.getElementById('oddsList'), tm=document.getElementById('oddsTime');
  const sell=(data.list||[]).filter(m=>m.st==='Selling');
  ODDS=sell;
  if(!sell.length){box.textContent='当前没有在售场次';tm.textContent='';return;}
  renderGlance();
  box.innerHTML=sell.map((m,i)=>
    `<div class="sc" onclick="pickOdds(${i})"><span>${m.num} ${m.lg}<br><b>${m.h} vs ${m.a}</b></span>
     <span class="p">欧 ${m.euTxt||'—'}</span></div>`).join('');
  const t=new Date(data.t);
  const upTxt=data.up?(' · 官网更新 '+String(data.up).slice(11,16)):'';
  const gate=inCloseWin()?'停售前 30 分钟':'平时 12 小时';
  tm.textContent=`${sell.length} 场在售 · 拉取于 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}${upTxt} · ${gate}`;
}

async function pullOdds(force){
  const btn=document.getElementById('pullBtn'), box=document.getElementById('oddsList');
  const c=oddsCache();
  if(!force && cacheFresh(c)){ renderOdds(c); return; }   // 缓存还新 → 不联网
  btn.disabled=true; btn.textContent='拉取中…';
  try{
    const r=await fetch(API,{cache:'no-store'});
    const d=await r.json();
    const list=[];
    for(const day of ((d.value||{}).matchInfoList||[]))
      for(const m of (day.subMatchList||[])){
        const hd=m.had||{}, hh=m.hhad||{};
        const mp=(m.marketProb||{}).live||(m.marketProb||{}).open||null;
        const co=(m.coral||{}).live||null;
        let eu=null;
        if(mp && mp.length===3) eu=mp.map(x=>1/x);      // 去水概率反推等效欧赔
        else if(co) eu=co;
        list.push({
          num:m.matchNumStr, lg:m.leagueAbbName,
          h:m.homeTeamAbbName, a:m.awayTeamAbbName,
          date:m.matchDate, time:m.matchTime, st:m.matchStatus,
          eu:eu,
          euTxt: eu? eu.map(x=>x.toFixed(2)).join('/') : '',
          jcTxt: hd.h? [hd.h,hd.d,hd.a].join('/') : '',
          coralTxt: co? co.join('/') : '',
          line:hh.goalLine, ch:hh.h, cd:hh.d, ca:hh.a,
          recent:m.recent||null, h2h:m.h2h||null,
          raw:{ no:m.matchNumStr, league:m.leagueAbbName,
                home:m.homeTeamAbbName, away:m.awayTeamAbbName,
                businessDate:m.matchDate, matchTime:m.matchTime, matchStatus:m.matchStatus,
                coral:(m.coral||null), marketProb:(m.marketProb||null), coralAt:(m.coralAt||null),
                had:(m.had||null), hhad:(m.hhad||null),
                recent:(m.recent||null), h2h:(m.h2h||null) }
        });
      }
    const data={t:Date.now(),up:((d.value||{}).lastUpdateTime||""),list};
    localStorage.setItem(ODDS_KEY,JSON.stringify(data));
    renderOdds(data);
    renderGlance();
    btn.textContent='刷新';
  }catch(e){
    if(c){ renderOdds(c); box.textContent='联网失败，显示上次数据：'+e.message; }
    else box.textContent='拉取失败：'+e.message+'　（可手动填）';
    btn.textContent='重试';
  }
  btn.disabled=false;
}

window.pickOdds=function(i){
  const m=ODDS[i]; if(!m)return;
  document.getElementById('h').value=m.h||'';
  document.getElementById('a').value=m.a||'';
  document.getElementById('hc').value=(m.line===''||m.line==null)?'':m.line;
  document.getElementById('ch').value=m.ch||'';
  document.getElementById('cd').value=m.cd||'';
  document.getElementById('ca').value=m.ca||'';
  if(m.eu){
    document.getElementById('oh').value=(+m.eu[0]).toFixed(2);
    document.getElementById('od').value=(+m.eu[1]).toFixed(2);
    document.getElementById('oa').value=(+m.eu[2]).toFixed(2);
  }
  renderRecent(m);
  const rc=document.getElementById('recentCard');
  (rc && rc.style.display!=='none' ? rc : document.getElementById('go')).scrollIntoView({behavior:'smooth',block:'start'});
};

document.getElementById('pullBtn').onclick=function(){ pullOdds(true); };
document.getElementById('expSnap').onclick=exportSnapshot;
(function(){
  const c=oddsCache();
  if(c) renderOdds(c);
  if(!cacheFresh(c)) pullOdds(false);
})();
