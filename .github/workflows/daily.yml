name: 每日云端预测

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install pandas numpy openpyxl

      - name: 跑预测
        run: python 云端预测.py

      - name: 提交结果
        run: |
          git config user.name  "lanshu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add 今日预测.json
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "云端预测 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
