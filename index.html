<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1a1a1a;font-size:16px;padding-bottom:70px}
header{background:#0B1F33;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}

/* ===== 移动端字号放大（覆盖前面） ===== */

.tabs button{font-size:15px;padding:13px 0}
label{font-size:13.5px}
.title{font-size:17px}
.badge{font-size:12.5px;padding:4px 11px}

.big{font-size:30px}
.three .v{font-size:20px}
.three .k{font-size:12.5px}
.grid9 .v{font-size:16px}
.grid9 .k{font-size:12.5px}
.tip{font-size:13.5px;line-height:1.75}
.sc{font-size:15px;padding:11px 2px}
.mini{font-size:13px;padding:6px 14px}
/* ===== 推荐页 ===== */
.seg{display:flex;gap:8px;margin-bottom:4px}
.seg button{flex:1;border:1px solid #0E6B66;background:#fff;color:#0E6B66;border-radius:9px;
  padding:11px 0;font-size:15px;font-weight:600;font-family:inherit}

.rc{background:#F5F8FC;border-radius:9px;padding:10px 12px;margin-top:8px}

  display:flex;justify-content:space-between;align-items:baseline}

/* ===== v3 调整 ===== */
body{padding-bottom:16px}

#oddsList .tm{font-size:16px;font-weight:700}

.gl .k{font-size:14px;color:#6b7785}
.gl .v{font-size:17px;font-weight:700;color:#0B1F33}
.gl .v em{font-style:normal;font-size:15px;color:#0E6B66;margin-left:6px}

/* ===== v4 近期状态 ===== */
.rs{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed #e3e9f1}
.rs:last-child{border-bottom:0}

.rs .rec{font-size:14px;color:#6b7785;margin-left:8px}

/* ===== v6 统计 ===== */
.strow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eef2f7}

.stbar{flex:1;display:flex;height:9px;border-radius:5px;overflow:hidden;margin:0 8px;background:#eef2f7}

.stbar .w{background:#0E6B66}.stbar .d{background:#C79100}.stbar .l{background:#C0504D}
.stn{font-size:12.5px;color:#8a95a3;width:52px;text-align:right}
.barrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px}
.barrow .k{width:46px;color:#6b7785}
.barrow .b{flex:1;height:10px;background:#eef2f7;border-radius:5px;overflow:hidden}
.barrow .b i{display:block;height:100%;background:#0E6B66}
.barrow .v{width:52px;text-align:right;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>澜枢</h1>
  <div class="sub">Dixon-Coles 泊松 · 只吃赔率 · 离线可用</div>
</header>
<div class="tabs">
  <button class="on" data-t="pred">预测</button>
  <button data-t="ledger">台账</button>
  <button data-t="rec">推荐</button>
  <button data-t="stat">统计</button>

</div>

<div class="page on" id="pred">
  <div class="card">
    <div class="title"><span>官网在售</span><span><button class="mini" id="expSnap" style="margin-right:6px">导出</button><button class="mini" id="pullBtn">拉取</button></span></div>
    <div id="oddsList" class="tip">点右上角「拉取官网」，一次拿到欧赔（多书商均值）、Coral、让球和近况</div>
    <div class="tip" id="oddsTime"></div>
  </div>
    <div class="card" id="recentCard" style="display:none">
    <div class="title"><span>近期状态</span><span class="tip" id="recentTip"></span></div>
    <div id="recentBody"></div>
  </div>
<div class="card">
    <div class="row">
      <div><label>主队</label><input id="h" placeholder="主队"></div>
      <div><label>客队</label><input id="a" placeholder="客队"></div>
    </div>
    <label>欧赔（必填）</label>
    <div class="row">
      <div><input id="oh" type="number" step="0.01" inputmode="decimal" placeholder="主胜"></div>
      <div><input id="od" type="number" step="0.01" inputmode="decimal" placeholder="平"></div>
      <div><input id="oa" type="number" step="0.01" inputmode="decimal" placeholder="客胜"></div>
    </div>
    <label>让球（选填，正=主队受让）</label>
    <div class="row">
      <div><input id="hc" type="number" step="1" inputmode="numeric" placeholder="让球数"></div>
      <div><input id="ch" type="number" step="0.01" inputmode="decimal" placeholder="让胜"></div>
      <div><input id="cd" type="number" step="0.01" inputmode="decimal" placeholder="让平"></div>
      <div><input id="ca" type="number" step="0.01" inputmode="decimal" placeholder="让负"></div>
    </div>
    <button class="go" id="calc">出结果</button>
  </div>
  <div id="out"></div>
</div>


<div class="page" id="rec">
  <div class="card">
    <div class="title"><span>今日推荐</span><span class="tip" id="recCount"></span></div>
    <div class="seg">
      <button id="leg2" class="on">2 串 1</button>
      <button id="leg3">3 串 1</button>
    </div>
    <div class="tip" style="margin-top:8px">只挑「把握度够高」的场次自动组合。胜平负看 60%、半全场看 40%、比分看前三合计 33%。</div>
  </div>
  <div id="recBody"></div>
</div>

<div class="page" id="stat">
  <div class="card">
    <div class="title"><span>历史统计</span><span class="tip" id="statN"></span></div>
    <div class="seg">
      <button class="on" data-d="ou">欧赔形态</button>
      <button data-d="jc">竞彩形态</button>
      <button data-d="hdc">让球形态</button>
    </div>
    <div class="tip" style="margin-top:8px">点一个形态，看它历史上一共多少场、主平客各占多少、场均几个球。</div>
  </div>
  <div class="card" id="statList"></div>
  <div class="card" id="statDetail" style="display:none"></div>
</div>

<div class="page" id="ledger">
  <div id="ledgerList"></div>
  <div class="card" id="calibBox"></div>
  <div class="card">
    <div class="title">数据</div>
    <div class="tip" id="storeInfo"></div>
    <div class="row" style="margin-top:10px">
      <button class="mini" id="exp" style="flex:1">导出给电脑</button>
      <button class="mini" id="imp" style="flex:1">导入/清空</button>
    </div>
  </div>
</div>

<script>
/* ============ 模型核心 ============ */
const KM=11,RHO=-0.05,S_HT=0.4424,STRETCH=0.06;
const GRID=[];for(let v=0.20;v<=3.6001;v+=0.05)GRID.push(+v.toFixed(2));
const NG=GRID.length;
function poisArr(l){const a=new Array(KM);let f=1;for(let i=0;i<KM;i++){if(i>0)f*=i;a[i]=Math.exp(-l)*Math.pow(l,i)/f;}return a;}
function scoreMatrix(lh,la){const ph=poisArr(lh),pa=poisArr(la);const m=[];let s=0;
 for(let i=0;i<KM;i++){m[i]=[];for(let j=0;j<KM;j++){let v=ph[i]*pa[j];
  if(i===0&&j===0)v*=1-lh*la*RHO;else if(i===0&&j===1)v*=1+lh*RHO;else if(i===1&&j===0)v*=1+la*RHO;else if(i===1&&j===1)v*=1-RHO;
  m[i][j]=v;s+=v;}}
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)m[i][j]/=s;return m;}
const TB=(function(){const t=new Float64Array(NG*NG*3);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const m=scoreMatrix(GRID[i],GRID[j]);let h=0,d=0,a=0;
  for(let x=0;x<KM;x++)for(let y=0;y<KM;y++){if(x>y)h+=m[x][y];else if(x===y)d+=m[x][y];else a+=m[x][y];}
  const k=(i*NG+j)*3;t[k]=h;t[k+1]=d;t[k+2]=a;}
 return t;})();
function targetTotal(ph,pd){const x=4.860176+49.726868*ph-33.017954*pd-55.647062*ph*ph+45.72*pd*pd-146.291582*ph*pd
 +6.616203*ph*ph*ph+35.885996*pd*pd*pd+103.161029*ph*ph*pd+97.962465*ph*pd*pd;
 return Math.min(Math.max(x,1.7),5.5);}
function fitLambda(ph,pd,pa){let mn=Infinity;const sse=new Float64Array(NG*NG);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const k=(i*NG+j)*3;
  const e=(TB[k]-ph)**2+(TB[k+1]-pd)**2+(TB[k+2]-pa)**2;sse[i*NG+j]=e;if(e<mn)mn=e;}
 const tol=mn+2e-4,tgt=targetTotal(ph,pd);let best=-1,bg=Infinity;
 for(let p=0;p<NG*NG;p++){if(sse[p]>tol)continue;const i=Math.floor(p/NG),j=p%NG;
  const g=Math.abs(GRID[i]+GRID[j]-tgt);if(g<bg){bg=g;best=p;}}
 const i=Math.floor(best/NG),j=best%NG,z=2*ph-1;
 return [GRID[i]*(1+STRETCH*z),GRID[j]*(1-STRETCH*z)];}
const SERIES=['胜胜','胜平','胜负','平胜','平平','平负','负胜','负平','负负'];
function htftDist(lh,la){const a=poisArr(S_HT*lh),b=poisArr(S_HT*la),c=poisArr((1-S_HT)*lh),d=poisArr((1-S_HT)*la);
 const out=new Array(9).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const w1=a[i]*b[j];if(w1<1e-12)continue;const s1=Math.sign(i-j);
  for(let k=0;k<KM;k++)for(let l=0;l<KM;l++){const w2=c[k]*d[l];if(w2<1e-12)continue;
   const s2=Math.sign((i+k)-(j+l));out[(1-s1)*3+(1-s2)]+=w1*w2;}}
 const s=out.reduce((x,y)=>x+y,0);return out.map(v=>v/s);}
function tier1x2(p){return p>=0.68?'高':p>=0.58?'中':p>=0.46?'低':'很低';}
function tierHtft(p){return p>=0.40?'高':p>=0.30?'中':p>=0.20?'低':'很低';}
function tierScore(p){return p>=0.33?'高':p>=0.28?'中':p>=0.23?'低':'很低';}
function upsetRisk(p){return p>=0.75?'低':p>=0.65?'较低':p>=0.55?'中':p>=0.45?'高':'极高';}

function predict(eu){const inv=eu.map(x=>1/x),s=inv.reduce((a,b)=>a+b,0),p0=inv.map(x=>x/s);
 /* 温度锐化 T=0.90：只影响显示的胜平负概率，比分/半全场矩阵仍用原始去水值 */
 const _s1=p0.map(x=>Math.pow(x,1/0.90)),_s2=_s1.reduce((a,b)=>a+b,0),p=_s1.map(x=>x/_s2);
 const L=fitLambda(p0[0],p0[1],p0[2]),lh=L[0],la=L[1],m=scoreMatrix(lh,la);
 const flat=[];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)flat.push([m[i][j],i+':'+j]);
 flat.sort((x,y)=>y[0]-x[0]);
 const tg=new Array(8).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j;tg[t>=7?7:t]+=m[i][j];}
 const hf=htftDist(lh,la),ord=hf.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
 const mx=Math.max(...p),pi=p.indexOf(mx),pickN=['主胜','平','客胜'][pi];
 const alts=[[p[0],'主胜'],[p[1],'平'],[p[2],'客胜']].filter(x=>x[1]!==pickN).sort((a,b)=>b[0]-a[0]);
 const bestIn=res=>{let b=[0,'0:0'];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const rr=i>j?'主胜':(i===j?'平':'客胜');if(rr===res&&m[i][j]>b[0])b=[m[i][j],i+':'+j];}return b;};
 let g2=0,g3=0,g4=0,best4=[0,'0:0'];
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j,v=m[i][j];
   if(t===2)g2+=v;else if(t===3)g3+=v;else if(t>=4){g4+=v;if(v>best4[0])best4=[v,i+':'+j];}}
 const risk=upsetRisk(mx);
 return {p,lh,la,pick:pickN,maxP:mx,tier:tier1x2(mx),risk,defend:(risk==='高'||risk==='极高'),
  alt1:alts[0],alt1s:bestIn(alts[0][1]),alt2:alts[1],alt2s:bestIn(alts[1][1]),
  g2,g3,g4,big4:best4,
  top3:flat.slice(0,3),p3:flat.slice(0,3).reduce((a,b)=>a+b[0],0),scoreTier:tierScore(flat.slice(0,3).reduce((a,b)=>a+b[0],0)),
  tg,peak:tg.indexOf(Math.max(...tg)),tgP:Math.max(...tg),
  hf,ord,hfFirst:ord[0],hfP:hf[ord[0]],hf3:hf[ord[0]]+hf[ord[1]]+hf[ord[2]],hfTier:tierHtft(hf[ord[0]]),
  top5:flat.slice(0,5)};}

/* ============ 存储 ============ */
const KEY='jc_pocket_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
const TC={'高':'b-high','中':'b-mid','低':'b-low','很低':'b-vlow'};
let CUR=null;

/* ============ 渲染 ============ */
function pct(x){return (x*100).toFixed(1)+'%'}
function render(r,meta){
  const P=r.p,names=['主胜','平','客胜'];
  const maxi=P.indexOf(Math.max(...P));
  let h=`<div class="card"><div class="title"><span>胜平负</span><span class="badge ${TC[r.tier]}">${r.tier}</span></div>
  <div class="big">${r.pick} <span style="font-size:20px">${pct(r.maxP)}</span></div>
  <div class="three">${P.map((v,i)=>`<div class="${i===maxi?'on':''}"><div class="v">${pct(v)}</div><div class="k">${names[i]}</div></div>`).join('')}</div></div>`;
  const rk={'低':'b-high','较低':'b-mid','中':'b-mid','高':'b-low','极高':'b-vlow'}[r.risk];
  h+=`<div class="card"><div class="title"><span>冷门方案</span><span class="badge ${rk}">风险 ${r.risk}</span></div>

/* ============ 近期状态（交锋 + 近5场） ============ */
function statRecent(list, teamIsHome) {
  if (!list || !list.length) return null;
  let w = 0, d = 0, l = 0, gf = 0, ga = 0, htHit = 0, n = 0;
  for (const x of list) {
    if (!x || !x.score) continue;
    const home = (x.venue === '主');
    const a = +x.score[0], b = +x.score[1];
    if (!isFinite(a) || !isFinite(b)) continue;
    const my = home ? a : b, opp = home ? b : a;
    gf += my; ga += opp; n++;
    if (x.ht && x.ht.length === 2) {
      const h1 = home ? +x.ht[0] : +x.ht[1], a1 = home ? +x.ht[1] : +x.ht[0];
      if (h1 + a1 > 0) htHit++;
    }
    if (x.result === '胜') w++; else if (x.result === '平') d++; else l++;
  }
  if (!n) return null;
  return { n: n, w: w, d: d, l: l, gf: gf / n, ga: ga / n, tot: (gf + ga) / n, ht: htHit / n };
}

function statH2H(list, homeName) {
  if (!list || !list.length) return null;
  let w = 0, d = 0, l = 0, tot = 0, n = 0;
  for (const x of list) {
    if (!x || !x.score) continue;
    const a = +x.score[0], b = +x.score[1];
    if (!isFinite(a) || !isFinite(b)) continue;
    const mine = (x.home === homeName);
    const my = mine ? a : b, opp = mine ? b : a;
    tot += a + b; n++;
    if (my > opp) w++; else if (my === opp) d++; else l++;
  }
  if (!n) return null;
  return { n: n, w: w, d: d, l: l, tot: tot / n };
}

  const card = document.getElementById('recentCard');

  if (!card || !box) return;

  const fh = statRecent((m.recent || {}).home, true);
  const fa = statRecent((m.recent || {}).away, false);
  const hh = statH2H(m.h2h, m.h);
  let h = '';
  const line = (name, s) => {
    if (!s) return '<div class="rs"><span class="who">' + name + '</span><span class="rec">暂无数据</span></div>';

  };
  h += line(m.h + '（近5场）', fh);

  }
  // 形态回查：用竞彩赔率算形态，再查 5,913 场历史统计
  try {
    const hd = (m.raw || {}).had || {};

             '<span class="who">竞彩形态 ' + cd + '</span>' +
             '<span class="rec">历史 ' + st.n + ' 场</span>' +
             '<span class="num">均' + st.avg + '球</span></div>' +
             '<div class="tip">主 ' + Math.round(st.w * 100) + '%　平 ' +
             Math.round(st.d * 100) + '%　客 ' + Math.round(st.l * 100) +
             '%　｜　最常见 ' + st.top[0][0] + ' ' + (st.top[0][1] * 100).toFixed(0) + '%</div>';
      }
    }
  } catch (e) {}
  box.innerHTML = h;
  document.getElementById('recentTip').textContent = '近5场来自官网，不是体彩赛程';
  card.style.display = '';

/* ============ 导出今日快照 ============ */
function exportSnapshot() {
  const c = oddsCache();
  const list = (c && c.list) || ODDS || [];
  const use = list.filter(m => m.raw && m.raw.home && m.raw.away);
  if (!use.length) { alert('还没有数据。先点「拉取官网」。'); return; }
  const now = new Date();
  const p2 = n => String(n).padStart(2, '0');
  const stamp = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) +
                ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
  const payload = {
    app: '澜枢', version: 1,
    exportedAt: now.toISOString(),
    snapshotAt: stamp,
    matches: use.map(m => m.raw)
  };
  const text = JSON.stringify(payload, null, 1);
  const name = '澜枢快照_' + stamp.replace(' ', '_').replace(':', '') + '.json';
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    alert('已导出：' + name + '\n\n共 ' + use.length + ' 场。\n把这个文件发给我就行。');
  } catch (e) {
    alert('导出失败：' + e.message);
  }

let STAT_DIM = 'ou';

function statKeys(dim) {
  const m = STATS.dims[dim] || {};
  return Object.keys(m).sort((a, b) => m[b].n - m[a].n);
}

function renderStatList() {
  const box = document.getElementById('statList');
  const det = document.getElementById('statDetail');
  if (!box) return;
  det.style.display = 'none';
  const m = STATS.dims[STAT_DIM] || {};
  const keys = statKeys(STAT_DIM);
  document.getElementById('statN').textContent = '共 ' + STATS.N.toLocaleString() + ' 场';
  let h = '';
  for (const k of keys) {
    const s = m[k];
    h += '<div class="strow" onclick="showStat(\'' + k + '\')">' +
         '<span class="stcode">' + k + '</span>' +
         '<span class="stbar"><i class="w" style="width:' + (s.w * 100) + '%"></i>' +
         '<i class="d" style="width:' + (s.d * 100) + '%"></i>' +
         '<i class="l" style="width:' + (s.l * 100) + '%"></i></span>' +
         '<span class="stn">' + s.n + '场</span></div>';
  }
  box.innerHTML = h;
}

window.showStat = function (code) {
  const m = STATS.dims[STAT_DIM] || {};
  const s = m[code];
  if (!s) return;
  const det = document.getElementById('statDetail');
  let h = '<div class="title"><span>' + code + '　' + s.n + ' 场</span>' +
          '<span class="tip">场均 ' + s.avg + ' 球</span></div>';
  h += '<div class="three">' +
       '<div><div class="v">' + Math.round(s.w * 100) + '%</div><div class="k">主胜</div></div>' +
       '<div><div class="v">' + Math.round(s.d * 100) + '%</div><div class="k">平</div></div>' +
       '<div><div class="v">' + Math.round(s.l * 100) + '%</div><div class="k">客胜</div></div>' +
       '</div>';
  h += '<div class="tip" style="margin:12px 0 4px">最常见比分</div>';
  const mx = s.top.length ? s.top[0][1] : 1;
  for (const [sc, p] of s.top) {
    h += '<div class="barrow"><span class="k">' + sc + '</span>' +
         '<span class="b"><i style="width:' + (p / mx * 100) + '%"></i></span>' +
         '<span class="v">' + (p * 100).toFixed(1) + '%</span></div>';
  }
  h += '<div class="tip" style="margin:12px 0 4px">总进球分布</div>';
  const mk = Math.max.apply(null, s.tg);
  for (let k = 0; k < s.tg.length; k++) {
    if (!s.tg[k]) continue;
    h += '<div class="barrow"><span class="k">' + (k === 7 ? '7+' : k) + ' 球</span>' +
         '<span class="b"><i style="width:' + (s.tg[k] / mk * 100) + '%"></i></span>' +
         '<span class="v">' + (s.tg[k] * 100).toFixed(1) + '%</span></div>';
  }
  h += '<div class="tip" style="margin:12px 0 4px">半全场前三</div>';
  const hfTop = s.hf.slice().sort((a, b) => b[1] - a[1]).slice(0, 3);
  h += '<div class="tip" style="margin:0">' + hfTop.map(x => x[0] + ' ' + (x[1] * 100).toFixed(1) + '%').join('　·　') + '</div>';
  det.innerHTML = h;
  det.style.display = '';
  det.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

document.querySelectorAll('#stat .seg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#stat .seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    STAT_DIM = b.dataset.d;
    renderStatList();
  };
});

document.querySelectorAll('.tabs button').forEach(b=>{

    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');
    if(b.dataset.t==='ledger'){renderLedger();renderCalib();}
    if(b.dataset.t==='rec')renderRec();
    if(b.dataset.t==='stat')renderStatList();
  };
});
document.getElementById('calc').onclick=()=>{
  const oh=+document.getElementById('oh').value,od=+document.getElementById('od').value,oa=+document.getElementById('oa').value;
  if(!(oh>0&&od>0&&oa>0)){alert('把三个欧赔填上');return;}
  const r=predict([oh,od,oa]);
  CUR={m:scoreMatrix(r.lh,r.la),r};
  const meta={date:new Date().toISOString().slice(0,10),
    home:document.getElementById('h').value||'主队',away:document.getElementById('a').value||'客队',
    eu:[oh,od,oa],handicap:document.getElementById('hc').value,jc:null};
  CUR.meta=meta;
  render(r,meta);
  window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('exp').onclick=()=>{
  const led=load();
  const txt=JSON.stringify(led,null,1);
  const blob=new Blob([txt],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='竞彩台账_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板，也存了文件')).catch(()=>{});
};
document.getElementById('imp').onclick=()=>{
  const v=prompt('粘贴导出的 JSON（导入会合并）；输入 CLEAR 清空全部：');
  if(!v)return;
  if(v.trim().toUpperCase()==='CLEAR'){if(confirm('确定清空台账？')){save([]);renderLedger();renderCalib();}return;}
  try{const add=JSON.parse(v);const cur=load();const ids=new Set(cur.map(x=>x.id));
    add.forEach(x=>{if(!ids.has(x.id))cur.push(x)});save(cur);renderLedger();renderCalib();alert('已导入');}
  catch(e){alert('JSON 格式不对');}
};
/* ============ 官网在售（云函数，含欧赔/Coral/让球） ============ */
const API='https://jcdata-pxigzkgjcb.cn-hangzhou.fcapp.run?t=1';
const ODDS_KEY='jc_odds_v2';
const TTL_NORMAL=12*3600*1000;   // 平时 12 小时
const TTL_CLOSE=30*60*1000;      // 停售前一小时 30 分钟
let ODDS=[];

function inCloseWin(){
  const d=new Date(), wd=d.getDay();
  return d.getHours()===((wd===0||wd===6)?22:21);
}
function ttlNow(){ return inCloseWin()?TTL_CLOSE:TTL_NORMAL; }
function oddsCache(){try{return JSON.parse(localStorage.getItem(ODDS_KEY)||'null')}catch(e){return null}}
function cacheFresh(c){ return !!(c && c.t && (Date.now()-c.t)<ttlNow()); }

function renderOdds(data){
  const box=document.getElementById('oddsList'), tm=document.getElementById('oddsTime');
  const sell=(data.list||[]).filter(m=>m.st==='Selling');
  ODDS=sell;
  if(!sell.length){box.textContent='当前没有在售场次';tm.textContent='';return;}
  renderGlance();
  box.innerHTML=sell.map((m,i)=>
    `<div class="sc" onclick="pickOdds(${i})"><span>${m.num} ${m.lg}<br><b>${m.h} vs ${m.a}</b></span>
     <span class="p">欧 ${m.euTxt||'—'}</span></div>`).join('');
  const t=new Date(data.t);
  const upTxt=data.up?(' · 官网更新 '+String(data.up).slice(11,16)):'';
  const gate=inCloseWin()?'停售前 30 分钟':'平时 12 小时';
  tm.textContent=`${sell.length} 场在售 · 拉取于 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}${upTxt} · ${gate}`;
}

async function pullOdds(force){
  const btn=document.getElementById('pullBtn'), box=document.getElementById('oddsList');
  const c=oddsCache();
  if(!force && cacheFresh(c)){ renderOdds(c); return; }   // 缓存还新 → 不联网
  btn.disabled=true; btn.textContent='拉取中…';
  try{
    const r=await fetch(API,{cache:'no-store'});
    const d=await r.json();
    const list=[];
    for(const day of ((d.value||{}).matchInfoList||[]))
      for(const m of (day.subMatchList||[])){
        const hd=m.had||{}, hh=m.hhad||{};
        const mp=(m.marketProb||{}).live||(m.marketProb||{}).open||null;
        const co=(m.coral||{}).live||null;
        let eu=null;
        if(mp && mp.length===3) eu=mp.map(x=>1/x);      // 去水概率反推等效欧赔
        else if(co) eu=co;
        list.push({
          num:m.matchNumStr, lg:m.leagueAbbName,
          h:m.homeTeamAbbName, a:m.awayTeamAbbName,
          date:m.matchDate, time:m.matchTime, st:m.matchStatus,
          eu:eu,
          euTxt: eu? eu.map(x=>x.toFixed(2)).join('/') : '',
          jcTxt: hd.h? [hd.h,hd.d,hd.a].join('/') : '',
          coralTxt: co? co.join('/') : '',
          line:hh.goalLine, ch:hh.h, cd:hh.d, ca:hh.a,
          recent:m.recent||null, h2h:m.h2h||null,
          raw:{ no:m.matchNumStr, league:m.leagueAbbName,
                home:m.homeTeamAbbName, away:m.awayTeamAbbName,
                businessDate:m.matchDate, matchTime:m.matchTime, matchStatus:m.matchStatus,
                coral:(m.coral||null), marketProb:(m.marketProb||null), coralAt:(m.coralAt||null),
                had:(m.had||null), hhad:(m.hhad||null),
                recent:(m.recent||null), h2h:(m.h2h||null) }
        });
      }
    const data={t:Date.now(),up:((d.value||{}).lastUpdateTime||""),list};
    localStorage.setItem(ODDS_KEY,JSON.stringify(data));
    renderOdds(data);
    renderGlance();
    btn.textContent='刷新';
  }catch(e){
    if(c){ renderOdds(c); box.textContent='联网失败，显示上次数据：'+e.message; }
    else box.textContent='拉取失败：'+e.message+'　（可手动填）';
    btn.textContent='重试';
  }
  btn.disabled=false;
}

window.pickOdds=function(i){
  const m=ODDS[i]; if(!m)return;
  document.getElementById('h').value=m.h||'';
  document.getElementById('a').value=m.a||'';
  document.getElementById('hc').value=(m.line===''||m.line==null)?'':m.line;
  document.getElementById('ch').value=m.ch||'';
  document.getElementById('cd').value=m.cd||'';
  document.getElementById('ca').value=m.ca||'';
  if(m.eu){
    document.getElementById('oh').value=(+m.eu[0]).toFixed(2);
    document.getElementById('od').value=(+m.eu[1]).toFixed(2);
    document.getElementById('oa').value=(+m.eu[2]).toFixed(2);
  }
  renderRecent(m);
  const rc=document.getElementById('recentCard');
  (rc && rc.style.display!=='none' ? rc : document.getElementById('go')).scrollIntoView({behavior:'smooth',block:'start'});
};

document.getElementById('pullBtn').onclick=function(){ pullOdds(true); };
document.getElementById('expSnap').onclick=exportSnapshot;
(function(){
  const c=oddsCache();
  if(c) renderOdds(c);
  if(!cacheFresh(c)) pullOdds(false);
})();
renderLedger();renderCalib();
