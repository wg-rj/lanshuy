name: 双模型预测（我 + Fable）

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: write

jobs:
  dual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install pandas numpy openpyxl

      - name: 跑双模型
        env:
          FABLE_KEY: ${{ secrets.FABLE_KEY }}
          FABLE_MODEL: anthropic/claude-fable-5.2
        run: |
          {
            echo "=== 诊断 ==="
            echo "key 长度 = ${#FABLE_KEY}"
            echo "key 前缀 = ${FABLE_KEY:0:10}"
            echo "model = $FABLE_MODEL"
            echo "pwd = $(pwd)"
            echo "今日预测.json 存在 = $([ -f 今日预测.json ] && echo yes || echo no)"
            echo "=== 脚本输出 ==="
          } > fable_debug.txt
          python fable_run.py 2>&1 | tee -a fable_debug.txt
          echo "退出码 = $?" >> fable_debug.txt

      - name: 提交结果
        run: |
          git config user.name  "lanshu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "双模型预测 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
