<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1F33">
<title>澜枢</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1a1a1a;font-size:16px;padding-bottom:70px}
header{background:#0B1F33;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
header .sub{font-size:11px;opacity:.75;margin-top:2px}
.tabs{display:flex;background:#fff;position:sticky;top:58px;z-index:19;border-bottom:1px solid #dde4ee}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:#666;font-family:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:#0B1F33;font-weight:600;border-bottom-color:#0E6B66}
.page{display:none;padding:12px}
.page.on{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,80,.07)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>div{flex:1}
label{display:block;font-size:12px;color:#6b7785;margin-bottom:4px}
input{width:100%;border:1px solid #d5dde8;border-radius:8px;padding:11px 10px;font-size:16px;font-family:inherit;background:#fbfcfe}
input:focus{outline:none;border-color:#0E6B66;background:#fff}
.go{width:100%;border:0;background:#0E6B66;color:#fff;padding:15px;border-radius:10px;font-size:16px;font-weight:600;font-family:inherit;margin-top:4px}
.go:active{background:#0B1F33}
.title{font-size:15px;font-weight:600;color:#0B1F33;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff}
.b-high{background:#2E7D32}.b-mid{background:#C79100}.b-low{background:#C0504D}.b-vlow{background:#8a8a8a}
.big{font-size:26px;font-weight:700;color:#0B1F33;line-height:1.15}
.bignum{font-size:13px;color:#6b7785;margin-top:2px}
.bar{height:7px;background:#E8EDF4;border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:#0E6B66;border-radius:4px}
.three{display:flex;gap:8px;margin-top:6px}
.three>div{flex:1;text-align:center;background:#F5F8FC;border-radius:8px;padding:8px 4px}
.three .v{font-size:18px;font-weight:700}
.three .k{font-size:11px;color:#6b7785;margin-top:2px}
.three .on{background:#E3EDF9;outline:1.5px solid #0E6B66}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid9>div{background:#F5F8FC;border-radius:7px;padding:7px 4px;text-align:center;position:relative;overflow:hidden}
.grid9 .v{font-size:15px;font-weight:700;position:relative}
.grid9 .k{font-size:11px;color:#6b7785;position:relative}
.grid9 .on{background:#E3EDF9;outline:1.5px solid #0E6B66}
.sc{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #e3e9f2;font-size:15px}
.sc:last-child{border:0}
.sc .p{color:#0E6B66;font-weight:700}
.list{font-size:14px}
.item{background:#fff;border-radius:10px;padding:12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,40,80,.06)}
.item .h{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:6px}
.item .m{font-size:12.5px;color:#5b6674;line-height:1.7}
.item .r{display:flex;gap:6px;margin-top:8px}
.item .r input{flex:1;padding:8px;font-size:14px}
.item .r button{border:0;background:#0E6B66;color:#fff;border-radius:8px;padding:0 14px;font-size:13px;font-family:inherit}
.hit{color:#2E7D32;font-weight:600}.miss{color:#C0504D;font-weight:600}
.empty{text-align:center;color:#8a95a3;padding:40px 20px;font-size:14px;line-height:1.9}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef2f7;font-size:15px}
.stat:last-child{border:0}
.stat b{color:#0B1F33}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde4ee;padding:8px 12px;display:flex;gap:8px;z-index:30}
.foot button{flex:1;border:1px solid #0E6B66;background:#fff;color:#0E6B66;padding:11px;border-radius:9px;font-size:14px;font-family:inherit}
.foot button.p{background:#0E6B66;color:#fff}
.tip{font-size:12px;color:#8a95a3;line-height:1.7;margin-top:8px}
.mini{border:1px solid #0E6B66;background:#fff;color:#0E6B66;border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;font-weight:600}
.mini:disabled{opacity:.5}
#oddsList{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#oddsList .sc{font-size:13px;padding:9px 2px;cursor:pointer}
#oddsList .sc:active{background:#EEF4F8}
#oddsList .p{font-size:13px;white-space:nowrap}
.del{color:#C0504D;font-size:12px;border:0;background:none;font-family:inherit;padding:0}
</style>
</head>
<body>
<header>
  <h1>澜枢</h1>
  <div class="sub">Dixon-Coles 泊松 · 只吃赔率 · 离线可用</div>
</header>
<div class="tabs">
  <button class="on" data-t="pred">预测</button>
  <button data-t="ledger">台账</button>
  <button data-t="calib">校准</button>
</div>

<div class="page on" id="pred">
  <div class="card">
    <div class="title"><span>体彩在售</span><button class="mini" id="pullBtn">拉取官网</button></div>
    <div id="oddsList" class="tip">点右上角「拉取官网」，直接从体彩官网取今天的场次和竞彩赔率</div>
    <div class="tip" id="oddsTime"></div>
  </div>
  <div class="card">
    <div class="row">
      <div><label>主队</label><input id="h" placeholder="主队"></div>
      <div><label>客队</label><input id="a" placeholder="客队"></div>
    </div>
    <label>欧赔（必填）</label>
    <div class="row">
      <div><input id="oh" type="number" step="0.01" inputmode="decimal" placeholder="主胜"></div>
      <div><input id="od" type="number" step="0.01" inputmode="decimal" placeholder="平"></div>
      <div><input id="oa" type="number" step="0.01" inputmode="decimal" placeholder="客胜"></div>
    </div>
    <label>让球（选填，正=主队受让）</label>
    <div class="row">
      <div><input id="hc" type="number" step="1" inputmode="numeric" placeholder="让球数"></div>
      <div><input id="ch" type="number" step="0.01" inputmode="decimal" placeholder="让胜"></div>
      <div><input id="cd" type="number" step="0.01" inputmode="decimal" placeholder="让平"></div>
      <div><input id="ca" type="number" step="0.01" inputmode="decimal" placeholder="让负"></div>
    </div>
    <button class="go" id="calc">出结果</button>
  </div>
  <div id="out"></div>
</div>

<div class="page" id="ledger">
  <div id="ledgerList"></div>
</div>

<div class="page" id="calib">
  <div class="card" id="calibBox"></div>
  <div class="card">
    <div class="title">数据</div>
    <div class="tip" id="storeInfo"></div>
  </div>
</div>

<div class="foot">
  <button id="exp">导出给电脑</button>
  <button class="p" id="imp">导入/清空</button>
</div>

<script>
/* ============ 模型核心 ============ */
const KM=11,RHO=-0.05,S_HT=0.4424,STRETCH=0.06;
const GRID=[];for(let v=0.20;v<=3.6001;v+=0.05)GRID.push(+v.toFixed(2));
const NG=GRID.length;
function poisArr(l){const a=new Array(KM);let f=1;for(let i=0;i<KM;i++){if(i>0)f*=i;a[i]=Math.exp(-l)*Math.pow(l,i)/f;}return a;}
function scoreMatrix(lh,la){const ph=poisArr(lh),pa=poisArr(la);const m=[];let s=0;
 for(let i=0;i<KM;i++){m[i]=[];for(let j=0;j<KM;j++){let v=ph[i]*pa[j];
  if(i===0&&j===0)v*=1-lh*la*RHO;else if(i===0&&j===1)v*=1+lh*RHO;else if(i===1&&j===0)v*=1+la*RHO;else if(i===1&&j===1)v*=1-RHO;
  m[i][j]=v;s+=v;}}
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)m[i][j]/=s;return m;}
const TB=(function(){const t=new Float64Array(NG*NG*3);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const m=scoreMatrix(GRID[i],GRID[j]);let h=0,d=0,a=0;
  for(let x=0;x<KM;x++)for(let y=0;y<KM;y++){if(x>y)h+=m[x][y];else if(x===y)d+=m[x][y];else a+=m[x][y];}
  const k=(i*NG+j)*3;t[k]=h;t[k+1]=d;t[k+2]=a;}
 return t;})();
function targetTotal(ph,pd){const x=4.860176+49.726868*ph-33.017954*pd-55.647062*ph*ph+45.72*pd*pd-146.291582*ph*pd
 +6.616203*ph*ph*ph+35.885996*pd*pd*pd+103.161029*ph*ph*pd+97.962465*ph*pd*pd;
 return Math.min(Math.max(x,1.7),5.5);}
function fitLambda(ph,pd,pa){let mn=Infinity;const sse=new Float64Array(NG*NG);
 for(let i=0;i<NG;i++)for(let j=0;j<NG;j++){const k=(i*NG+j)*3;
  const e=(TB[k]-ph)**2+(TB[k+1]-pd)**2+(TB[k+2]-pa)**2;sse[i*NG+j]=e;if(e<mn)mn=e;}
 const tol=mn+2e-4,tgt=targetTotal(ph,pd);let best=-1,bg=Infinity;
 for(let p=0;p<NG*NG;p++){if(sse[p]>tol)continue;const i=Math.floor(p/NG),j=p%NG;
  const g=Math.abs(GRID[i]+GRID[j]-tgt);if(g<bg){bg=g;best=p;}}
 const i=Math.floor(best/NG),j=best%NG,z=2*ph-1;
 return [GRID[i]*(1+STRETCH*z),GRID[j]*(1-STRETCH*z)];}
const SERIES=['胜胜','胜平','胜负','平胜','平平','平负','负胜','负平','负负'];
function htftDist(lh,la){const a=poisArr(S_HT*lh),b=poisArr(S_HT*la),c=poisArr((1-S_HT)*lh),d=poisArr((1-S_HT)*la);
 const out=new Array(9).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const w1=a[i]*b[j];if(w1<1e-12)continue;const s1=Math.sign(i-j);
  for(let k=0;k<KM;k++)for(let l=0;l<KM;l++){const w2=c[k]*d[l];if(w2<1e-12)continue;
   const s2=Math.sign((i+k)-(j+l));out[(1-s1)*3+(1-s2)]+=w1*w2;}}
 const s=out.reduce((x,y)=>x+y,0);return out.map(v=>v/s);}
function tier1x2(p){return p>=0.65?'高':p>=0.55?'中':p>=0.45?'低':'很低';}
function tierHtft(p){return p>=0.40?'高':p>=0.30?'中':p>=0.20?'低':'很低';}
function tierScore(p){return p>=0.33?'高':p>=0.28?'中':p>=0.23?'低':'很低';}
function upsetRisk(p){return p>=0.75?'低':p>=0.65?'较低':p>=0.55?'中':p>=0.45?'高':'极高';}

function predict(eu){const inv=eu.map(x=>1/x),s=inv.reduce((a,b)=>a+b,0),p=inv.map(x=>x/s);
 const L=fitLambda(p[0],p[1],p[2]),lh=L[0],la=L[1],m=scoreMatrix(lh,la);
 const flat=[];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++)flat.push([m[i][j],i+':'+j]);
 flat.sort((x,y)=>y[0]-x[0]);
 const tg=new Array(8).fill(0);
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j;tg[t>=7?7:t]+=m[i][j];}
 const hf=htftDist(lh,la),ord=hf.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
 const mx=Math.max(...p),pi=p.indexOf(mx),pickN=['主胜','平','客胜'][pi];
 const alts=[[p[0],'主胜'],[p[1],'平'],[p[2],'客胜']].filter(x=>x[1]!==pickN).sort((a,b)=>b[0]-a[0]);
 const bestIn=res=>{let b=[0,'0:0'];for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const rr=i>j?'主胜':(i===j?'平':'客胜');if(rr===res&&m[i][j]>b[0])b=[m[i][j],i+':'+j];}return b;};
 let g2=0,g3=0,g4=0,best4=[0,'0:0'];
 for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const t=i+j,v=m[i][j];
   if(t===2)g2+=v;else if(t===3)g3+=v;else if(t>=4){g4+=v;if(v>best4[0])best4=[v,i+':'+j];}}
 const risk=upsetRisk(mx);
 return {p,lh,la,pick:pickN,maxP:mx,tier:tier1x2(mx),risk,defend:(risk==='高'||risk==='极高'),
  alt1:alts[0],alt1s:bestIn(alts[0][1]),alt2:alts[1],alt2s:bestIn(alts[1][1]),
  g2,g3,g4,big4:best4,
  top3:flat.slice(0,3),p3:flat.slice(0,3).reduce((a,b)=>a+b[0],0),scoreTier:tierScore(flat.slice(0,3).reduce((a,b)=>a+b[0],0)),
  tg,peak:tg.indexOf(Math.max(...tg)),tgP:Math.max(...tg),
  hf,ord,hfFirst:ord[0],hfP:hf[ord[0]],hf3:hf[ord[0]]+hf[ord[1]]+hf[ord[2]],hfTier:tierHtft(hf[ord[0]]),
  top5:flat.slice(0,5)};}

/* ============ 存储 ============ */
const KEY='jc_pocket_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
const TC={'高':'b-high','中':'b-mid','低':'b-low','很低':'b-vlow'};
let CUR=null;

/* ============ 渲染 ============ */
function pct(x){return (x*100).toFixed(1)+'%'}
function render(r,meta){
  const P=r.p,names=['主胜','平','客胜'];
  const maxi=P.indexOf(Math.max(...P));
  let h=`<div class="card"><div class="title"><span>胜平负</span><span class="badge ${TC[r.tier]}">${r.tier}</span></div>
  <div class="big">${r.pick} <span style="font-size:20px">${pct(r.maxP)}</span></div>
  <div class="three">${P.map((v,i)=>`<div class="${i===maxi?'on':''}"><div class="v">${pct(v)}</div><div class="k">${names[i]}</div></div>`).join('')}</div></div>`;
  const rk={'低':'b-high','较低':'b-mid','中':'b-mid','高':'b-low','极高':'b-vlow'}[r.risk];
  h+=`<div class="card"><div class="title"><span>冷门方案</span><span class="badge ${rk}">风险 ${r.risk}</span></div>
  <div class="big" style="color:${r.defend?'#C0504D':'#2E7D32'}">${r.defend?'⚠ 要防冷门':'✓ 不用防'}</div>
  <div class="bignum">首选 ${r.pick} ${pct(r.maxP)}　${r.defend?'把握度不够，冷门率过半':'首选够硬，冷门率低'}</div>
  <div class="sc"><span>${r.alt1[1]}（冷门主方向）</span><span class="p">${pct(r.alt1[0])} → ${r.alt1s[1]} ${pct(r.alt1s[0])}</span></div>
  <div class="sc"><span>${r.alt2[1]}（次要方向）</span><span class="p">${pct(r.alt2[0])} → ${r.alt2s[1]} ${pct(r.alt2s[0])}</span></div>
  <div class="tip">风险档按全库 5,861 场的实际冷门率：>75% 仅 13%，<45% 高达 58%。分界线 55%。</div></div>`;
  h+=`<div class="card"><div class="title"><span>半全场</span><span class="badge ${TC[r.hfTier]}">${r.hfTier}</span></div>
  <div class="big">${SERIES[r.hfFirst]} <span style="font-size:20px">${pct(r.hfP)}</span></div>
  <div class="bignum">三选合计 ${pct(r.hf3)}（历史 top1 约 35%，看三选）</div>
  <div class="grid9">${r.hf.map((v,i)=>`<div class="${i===r.hfFirst?'on':''}"><div class="v">${pct(v)}</div><div class="k">${SERIES[i]}</div></div>`).join('')}</div></div>`;
  const mxg=Math.max(r.g2,r.g3,r.g4);
  h+=`<div class="card"><div class="title"><span>比分</span><span class="badge ${TC[r.scoreTier]}">前三 ${pct(r.p3)}</span></div>
  <div class="three">
    <div class="${r.g2===mxg?'on':''}"><div class="v">${pct(r.g2)}</div><div class="k">2 球</div></div>
    <div class="${r.g3===mxg?'on':''}"><div class="v">${pct(r.g3)}</div><div class="k">3 球</div></div>
    <div class="${r.g4===mxg?'on':''}"><div class="v">${pct(r.g4)}</div><div class="k">4+ 球</div></div>
  </div>
  <div class="tip" style="margin:10px 0 2px">单个比分（概率都很低）</div>
  ${r.top3.map(x=>`<div class="sc"><span>${x[1]}</span><span class="p">${pct(x[0])}</span></div>`).join('')}
  <div class="tip">4+ 球里最可能：${r.big4[1]} ${pct(r.big4[0])}｜首选比分只有 ${pct(r.top3[0][0])}</div></div>`;
  h+=`<div class="card"><div class="title"><span>总进球</span><span class="badge b-low">峰值 ${r.peak} 球</span></div>
  <div class="three">${r.tg.map((v,i)=>`<div class="${i===r.peak?'on':''}"><div class="v">${pct(v)}</div><div class="k">${i===7?'7+':i}</div></div>`).join('')}</div>
  <div class="tip">λ主 ${r.lh.toFixed(2)}　λ客 ${r.la.toFixed(2)}　期望 ${(r.lh+r.la).toFixed(2)} 球</div></div>`;
  if(meta.handicap!==null&&meta.handicap!==''&&!isNaN(+meta.handicap)){
    const k=Math.round(+meta.handicap);const h1=[0,0,0];
    for(let i=0;i<KM;i++)for(let j=0;j<KM;j++){const d=i-j+k;if(d>0)h1[0]+=CUR.m[i][j];else if(d===0)h1[1]+=CUR.m[i][j];else h1[2]+=CUR.m[i][j];}
    CUR.hc=h1;CUR.hcK=k;
    const mi=h1.indexOf(Math.max(...h1));
    h+=`<div class="card"><div class="title"><span>让球 ${k>0?'+':''}${k}</span><span class="badge ${TC[tier1x2(Math.max(...h1))]}">${tier1x2(Math.max(...h1))}</span></div>
    <div class="big">${['让胜','让平','让负'][mi]} <span style="font-size:20px">${pct(Math.max(...h1))}</span></div>
    <div class="three">${h1.map((v,i)=>{const on=i===mi?'on':'';return `<div class="${on}"><div class="v">${pct(v)}</div><div class="k">${['让胜','让平','让负'][i]}</div></div>`}).join('')}</div></div>`;
  } else {CUR.hc=null;}
  h+=`<button class="go" id="keep" style="background:#2E7D32">存进台账</button>`;
  document.getElementById('out').innerHTML=h;
  document.getElementById('keep').onclick=()=>{
    const led=load();
    led.push({id:Date.now(),date:meta.date,home:meta.home,away:meta.away,odds:meta.eu,
      handicap:meta.handicap||'',  jc:meta.jc||null,
      p:P.map(v=>+v.toFixed(4)),pick:r.pick,tier:r.tier,
      hfFirst:SERIES[r.hfFirst],hfP:+r.hfP.toFixed(4),hf3:+r.hf3.toFixed(4),
      score:r.top3[0][1],scoreP:+r.top3[0][0].toFixed(4),p3:+r.p3.toFixed(4),
      peak:r.peak,risk:r.risk,defend:r.defend,
      hcPick:CUR.hc?['让胜','让平','让负'][CUR.hc.indexOf(Math.max(...CUR.hc))]:'',
      result:'',htft:'',scored:false});
    save(led);
    document.getElementById('keep').textContent='已存 ✓';
    document.getElementById('keep').style.background='#8a8a8a';
    renderLedger();
  };
}

/* ============ 台账 ============ */
function renderLedger(){
  const led=load();const box=document.getElementById('ledgerList');
  if(!led.length){box.innerHTML='<div class="empty">还没有记录<br>预测完点「存进台账」就在这</div>';return;}
  box.innerHTML=led.slice().reverse().map(it=>{
    let hit='';
    if(it.scored){
      const y=it.result.split(':').map(Number);
      const m=y[0]>y[1]?'主胜':(y[0]===y[1]?'平':'客胜');
      const ok1=m===it.pick;
      const hf=it.htft||'';
      const ok2=hf===it.hfFirst;
      const okS=it.result.replace(':','-')===it.score.replace(':','-');
      hit=`<div class="m">结果 <b>${it.result}</b> ${hf?'· '+hf:''}　
        胜平负<span class="${ok1?'hit':'miss'}">${ok1?'✓':'✗'}</span>
        半全场<span class="${ok2?'hit':'miss'}">${ok2?'✓':'✗'}</span>
        比分<span class="${okS?'hit':'miss'}">${okS?'✓':'✗'}</span></div>`;
    }
    return `<div class="item"><div class="h"><span>${it.home} vs ${it.away}</span>
      <button class="del" onclick="delItem(${it.id})">删</button></div>
      <div class="m">${it.pick} ${pct(it.p[it.pick==='主胜'?0:it.pick==='平'?1:2])}（${it.tier}）·
      半全场 ${it.hfFirst} ${pct(it.hfP)} · 比分 ${it.score} ${pct(it.scoreP)}</div>
      ${it.scored?hit:`<div class="r"><input placeholder="比分 2-1" id="r${it.id}"><input placeholder="半全场 胜胜" id="t${it.id}" style="max-width:105px"><button onclick="setResult(${it.id})">记</button></div>`}
      </div>`;
  }).join('');
  document.getElementById('storeInfo').textContent=`共 ${led.length} 场，已记结果 ${led.filter(x=>x.scored).length} 场。数据存在这台设备的浏览器里，换设备/清缓存会丢——记得导出。`;
}
window.delItem=function(id){save(load().filter(x=>x.id!==id));/* ============ 官网赔率 ============ */
const API='https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?poolCode=hhad,had&channel=c';
const ODDS_KEY='jc_odds_v1';
let ODDS=[];
function oddsCache(){try{return JSON.parse(localStorage.getItem(ODDS_KEY)||'null')}catch(e){return null}}
function renderOdds(data){
  const box=document.getElementById('oddsList'), tm=document.getElementById('oddsTime');
  const sell=(data.list||[]).filter(m=>m.st==='Selling');
  ODDS=sell;
  if(!sell.length){box.textContent='当前没有在售场次';tm.textContent='';return;}
  box.innerHTML=sell.map((m,i)=>
    `<div class="sc" onclick="pickOdds(${i})"><span>${m.num} ${m.lg}<br><b>${m.h} vs ${m.a}</b></span>
     <span class="p">${m.hh}/${m.hd}/${m.ha}</span></div>`).join('');
  const t=new Date(data.t);
  tm.textContent=`${sell.length} 场在售 · 更新于 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}
async function pullOdds(){
  const btn=document.getElementById('pullBtn'), box=document.getElementById('oddsList');
  btn.disabled=true; btn.textContent='拉取中…';
  try{
    const r=await fetch(API,{cache:'no-store'});
    const d=await r.json();
    const list=[];
    for(const day of ((d.value||{}).matchInfoList||[]))
      for(const m of (day.subMatchList||[])){
        const hd=m.had||{}, hh=m.hhad||{};
        list.push({num:m.matchNumStr,lg:m.leagueAbbName,h:m.homeTeamAbbName,a:m.awayTeamAbbName,
          date:m.matchDate,time:m.matchTime,st:m.matchStatus,
          hh:hd.h,hd:hd.d,ha:hd.a,line:hh.goalLine,ch:hh.h,cd:hh.d,ca:hh.a});
      }
    const data={t:Date.now(),list};
    localStorage.setItem(ODDS_KEY,JSON.stringify(data));
    renderOdds(data);
    btn.textContent='刷新';
  }catch(e){
    box.textContent='拉取失败：'+e.message+'　（不影响手动填）';
    btn.textContent='重试';
  }
  btn.disabled=false;
}
window.pickOdds=function(i){
  const m=ODDS[i]; if(!m)return;
  document.getElementById('h').value=m.h||'';
  document.getElementById('a').value=m.a||'';
  document.getElementById('hc').value=(m.line===''||m.line==null)?'':m.line;
  document.getElementById('ch').value=m.ch||'';
  document.getElementById('cd').value=m.cd||'';
  document.getElementById('ca').value=m.ca||'';
  const oh=document.getElementById('oh');
  oh.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>oh.focus(),200);
};
document.getElementById('pullBtn').onclick=pullOdds;
(function(){
  const c=oddsCache();
  if(c) renderOdds(c);
  else pullOdds();
})();
renderLedger();renderCalib();};
window.setResult=function(id){
  const led=load();const it=led.find(x=>x.id===id);if(!it)return;
  const s=(document.getElementById('r'+id).value||'').trim().replace(':','-');
  const t=(document.getElementById('t'+id).value||'').trim();
  if(!/^\d+-\d+$/.test(s)){alert('比分格式：2-1');return;}
  it.result=s;it.htft=t;it.scored=true;save(led);renderLedger();renderCalib();
};

/* ============ 校准 ============ */
function renderCalib(){
  const led=load().filter(x=>x.scored);const box=document.getElementById('calibBox');
  if(!led.length){box.innerHTML='<div class="empty">还没有已记结果的场次</div>';return;}
  const grp={};let ok1=0,ok2=0,okS=0;
  led.forEach(it=>{
    const y=it.result.split('-').map(Number);
    const m=y[0]>y[1]?'主胜':(y[0]===y[1]?'平':'客胜');
    const a=m===it.pick,b=it.htft===it.hfFirst,c=it.result===it.score.replace(':','-');
    ok1+=a;ok2+=b;okS+=c;
    grp[it.tier]=grp[it.tier]||{n:0,h:0};grp[it.tier].n++;grp[it.tier].h+=a?1:0;
  });
  const n=led.length;
  let h=`<div class="title">校准（${n} 场）</div>
   <div class="stat"><span>胜平负命中</span><b>${ok1}/${n}（${(ok1/n*100).toFixed(1)}%）</b></div>
   <div class="stat"><span>半全场首选</span><b>${ok2}/${n}（${(ok2/n*100).toFixed(1)}%）</b></div>
   <div class="stat"><span>比分首选</span><b>${okS}/${n}（${(okS/n*100).toFixed(1)}%）</b></div>
   <div class="tip">历史基准：胜平负 55%、半全场 34%、比分 12%</div>`;
  h+=`<div class="title" style="margin-top:14px">按把握度</div>`;
  ['高','中','低','很低'].forEach(t=>{
    if(!grp[t])return;
    h+=`<div class="stat"><span>${t}</span><b>${grp[t].h}/${grp[t].n}（${(grp[t].h/grp[t].n*100).toFixed(0)}%）</b></div>`;
  });
  box.innerHTML=h;
}

/* ============ 事件 ============ */
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');
    if(b.dataset.t==='ledger')renderLedger();
    if(b.dataset.t==='calib')renderCalib();
  };
});
document.getElementById('calc').onclick=()=>{
  const oh=+document.getElementById('oh').value,od=+document.getElementById('od').value,oa=+document.getElementById('oa').value;
  if(!(oh>0&&od>0&&oa>0)){alert('把三个欧赔填上');return;}
  const r=predict([oh,od,oa]);
  CUR={m:scoreMatrix(r.lh,r.la),r};
  const meta={date:new Date().toISOString().slice(0,10),
    home:document.getElementById('h').value||'主队',away:document.getElementById('a').value||'客队',
    eu:[oh,od,oa],handicap:document.getElementById('hc').value,jc:null};
  CUR.meta=meta;
  render(r,meta);
  window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('exp').onclick=()=>{
  const led=load();
  const txt=JSON.stringify(led,null,1);
  const blob=new Blob([txt],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='竞彩台账_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板，也存了文件')).catch(()=>{});
};
document.getElementById('imp').onclick=()=>{
  const v=prompt('粘贴导出的 JSON（导入会合并）；输入 CLEAR 清空全部：');
  if(!v)return;
  if(v.trim().toUpperCase()==='CLEAR'){if(confirm('确定清空台账？')){save([]);renderLedger();renderCalib();}return;}
  try{const add=JSON.parse(v);const cur=load();const ids=new Set(cur.map(x=>x.id));
    add.forEach(x=>{if(!ids.has(x.id))cur.push(x)});save(cur);renderLedger();renderCalib();alert('已导入');}
  catch(e){alert('JSON 格式不对');}
};
renderLedger();renderCalib();
</script>
